name: Military arrival PostgreSQL acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  military-pg:
    name: Military PG17 (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [ordinary, race]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Record exact source and PostgreSQL version
        shell: bash
        run: |
          git rev-parse HEAD HEAD^{tree}
          go version
          command -v psql
          docker exec "${{ job.services.postgres.id }}" psql -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c 'SELECT version()'
          version=$(docker exec "${{ job.services.postgres.id }}" psql -U sanguo -d sanguo -Atc 'SHOW server_version_num')
          [[ "$version" -ge 170000 && "$version" -lt 180000 ]]
      - name: Build fail-closed evidence auditor
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/audit-military.py" <<'PY'
          import json
          import sys

          root = "github.com/anitaguptaoffice/sanguo-slg/internal/military/"
          packages = {root + name for name in ("combat", "march", "report")}
          required = {
              (root + "combat", "TestPGDurableResolverHubRestore"),
              (root + "combat", "TestPGDurableResolverProcessRestart"),
              (root + "report", "TestPGStoreSaveGetList"),
          }
          for scenario in ("battle", "no-battle", "all-dead", "sql-failure", "outer-commit-failure"):
              required.add((root + "combat", "TestPGDurableResolverHubRestore/" + scenario))
          for name in (
              "TestPGMarchArrivalStatusThreeNotReplayed", "TestPGMarchArrivalReplay",
              "TestPGMarchArrivalConcurrent", "TestPGMarchArrivalRejectsMissing",
              "TestPGMarchArrivalNoBattleAndZeroBattle", "TestPGMarchArrivalRejectsNoBattleMismatch",
              "TestPGMarchArrivalNoBattleEmpty", "TestPGMarchArrivalSavepointLogicalFailures",
              "TestPGMarchArrivalLockedStackContention", "TestPGMarchArrivalFailpoints",
              "TestPGMarchArrivalPostReportFailure", "TestPGMarchArrivalSequenceDecoy",
              "TestPGMarchArrivalSequenceAudit", "TestPGMarchArrivalCanceledCleanup",
              "TestPGMarchArrivalCallerTransaction", "TestPGMarchRestore",
              "TestPGMarchRestoreEmptyOnce", "TestPGRestoreSnapDetectsNoopWrite",
          ):
              required.add((root + "march", name))

          def audit(events):
              bad = [e for e in events if e["Action"] in ("skip", "fail")]
              passed = {(e.get("Package"), e.get("Test")) for e in events if e["Action"] == "pass"}
              needed = required | {(p, None) for p in packages}
              started = {(e.get("Package"), e.get("Test")) for e in events if e["Action"] == "run"}
              missing = (needed | started) - passed
              if bad or missing:
                  raise ValueError(f"PG gate failed: bad={bad}, missing={sorted(map(str, missing))}")
              top = sum(test is not None and "/" not in test for _, test in passed)
              sub = sum(test is not None and "/" in test for _, test in passed)
              print(f"PASS: {len(packages)} packages, {top} top-level tests, {sub} subtests, zero skips/failures")

          if sys.argv[1] == "--self-test":
              valid = [{"Action": "pass", "Package": p, "Test": t} for p, t in required]
              valid += [{"Action": "pass", "Package": p} for p in packages]
              audit(valid)
              for bad in (valid[1:], valid + [{"Action": "skip"}], valid + [{"Action": "fail"}]):
                  try:
                      audit(bad)
                  except ValueError:
                      continue
                  raise SystemExit("auditor accepted missing/skipped/failed evidence")
              print("Auditor negative controls passed")
          else:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  audit([json.loads(line) for line in stream if line.strip()])
          PY
          python3 "$RUNNER_TEMP/audit-military.py" --self-test
      - name: Run all military packages with real PostgreSQL
        shell: bash
        env:
          DATABASE_URL: postgres://sanguo:sanguo@localhost:5432/military_acceptance?sslmode=disable
          MODE: ${{ matrix.mode }}
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE military_acceptance'
          flags=()
          if [[ "$MODE" == race ]]; then flags=(-race); fi
          log="$RUNNER_TEMP/military-$MODE.json"
          go test ./internal/military/combat ./internal/military/march ./internal/military/report \
            "${flags[@]}" -count=1 -timeout=15m -json | tee "$log"
          python3 "$RUNNER_TEMP/audit-military.py" "$log"
          echo 'Evidence includes Hub reconstruction and separate test-binary processes after acknowledged COMMIT.'
          echo 'It does not prove PostgreSQL server restart, uncertain network COMMIT recovery or production activation.'
      - name: Remove disposable acceptance database
        if: always()
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS military_acceptance WITH (FORCE)'
          remaining=$(docker exec "${{ job.services.postgres.id }}" psql -U sanguo -d sanguo \
            -Atc "SELECT count(*) FROM pg_database WHERE datname='military_acceptance'")
          [[ "$remaining" == 0 ]]
          echo 'Disposable acceptance database absent.'
