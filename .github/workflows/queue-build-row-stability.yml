name: Queue build row stability
on:
  pull_request:
    paths: ['.github/workflows/queue-build-row-stability.yml', 'client/qa/queueBuildRowStability.browser.mjs', 'client/qa/QUEUE-BUILD-ROW-STABILITY.md']
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: b9ec649833523887f84dccc862021465f83a4c8f
          fetch-depth: 0
          persist-credentials: false
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose immutable reviewed source
        run: |
          cd target
          test "$(git rev-parse HEAD)" = b9ec649833523887f84dccc862021465f83a4c8f
          test "$(git rev-parse HEAD^{tree})" = 95664daba694c631e9e1d635d37b7a2bc4c92095
          cp ../harness/client/qa/queueBuildRowStability.browser.mjs client/qa/
      - name: Install official locked dependencies
        working-directory: target/client
        run: npm ci && npx --no-install playwright install --with-deps chromium
      - name: Test actual host with disposable local fixture
        working-directory: target/client
        env:
          QA_OUT: ${{ runner.temp }}/queue-row-stability
        run: node qa/queueBuildRowStability.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-row-stability-${{ github.sha }}
          path: ${{ runner.temp }}/queue-row-stability/
          if-no-files-found: error
