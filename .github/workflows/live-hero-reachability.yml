name: Live hero mouse reachability diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/live-hero-reachability.yml'
      - '.github/scripts/live_hero_reachability.mjs'
      - '.github/scripts/LIVE_HERO_REACHABILITY.md'
permissions:
  contents: read
jobs:
  live-hero-reachability:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [1280, 1600]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: live_hero_reachability
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanguo -d live_hero_reachability"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Initialize failure evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '{"passed":false,"phase":"setup; inspect job logs"}\n' > evidence/preflight.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: qa-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a020369eb4f58e835522934c662ab1fd3d4161e3
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Assert frozen product combination
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = a020369eb4f58e835522934c662ab1fd3d4161e3
          test "$(git rev-parse HEAD^{tree})" = 16fb9da5b53af34d75cae9cbbd21a8e39f1dcfed
          test "$(git show -s --format=%P HEAD)" = "409ad569415ea7215dc1297c2306423d0392dea4 757e43a9f40d7c92ded6a536ec334de94d69ff6f"
          test "$(git rev-parse 409ad569415ea7215dc1297c2306423d0392dea4^)" = e2b60dda830d9b25f15fcfced4da4acc090a8f1c
          test -z "$(git status --porcelain)"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: target/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/client/package-lock.json
      - name: Build actual server; test and build complete client
        timeout-minutes: 10
        working-directory: target
        env:
          GOTOOLCHAIN: local
          VITE_GATEWAY_WS_URL: ws://127.0.0.1:8080/ws
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/live-hero-reachability-server" ./cmd/server 2>&1 | tee ../evidence/build-server.log
          cd client
          npm ci 2>&1 | tee ../../evidence/install.log
          npm test 2>&1 | tee ../../evidence/client-tests.log
          npm run build 2>&1 | tee ../../evidence/client-build.log
          npx --no-install playwright install --with-deps chromium
      - name: Run isolated mouse-only diagnostic
        working-directory: target/client
        env:
          QA_WIDTH: ${{ matrix.width }}
          QA_OUT: ${{ github.workspace }}/evidence
          QA_SERVER: ${{ runner.temp }}/live-hero-reachability-server
          DATABASE_URL: postgres://sanguo:sanguo@127.0.0.1:5432/live_hero_reachability?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          PGHOST: 127.0.0.1
          PGUSER: sanguo
          PGPASSWORD: sanguo
          PGDATABASE: live_hero_reachability
        run: |
          cp ../../qa-source/.github/scripts/live_hero_reachability.mjs .qa-live-hero-reachability.mjs
          node .qa-live-hero-reachability.mjs --self-test
          node .qa-live-hero-reachability.mjs
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hero-reachability-${{ matrix.width }}-${{ github.event.pull_request.head.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
