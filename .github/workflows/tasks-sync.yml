name: Tasks sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tasks/backlog.yml
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  contents: read

jobs:
  sync:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, 'wave:23 tasks_sync') || contains(github.event.pull_request.title, 'tasks_sync: wave:23') || contains(github.event.pull_request.title, 'wave:22 tasks_sync') || contains(github.event.pull_request.title, 'wave:19 tasks_sync')))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Close mistaken duplicate issues (#306–#325)
        if: contains(github.event.pull_request.title, 'wave:19 tasks_sync') || github.event_name == 'workflow_dispatch'
        run: |
          COMMENT='duplicate: 旧 wave 任务早已合入；本次全量 sync 误重建。'
          for n in $(seq 306 325); do
            gh issue close "$n" --reason "not planned" --comment "$COMMENT" || true
          done
      - name: Sync backlog issues
        run: |
          if echo "${{ github.event.pull_request.title }}" | grep -qE 'wave:23 tasks_sync|tasks_sync: wave:23'; then
            python3 tools/tasks_sync.py --wave=23
          elif echo "${{ github.event.pull_request.title }}" | grep -q 'wave:22 tasks_sync'; then
            python3 tools/tasks_sync.py --wave=22
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/tasks_sync.py --wave=19
          else
            python3 tools/tasks_sync.py
          fi
