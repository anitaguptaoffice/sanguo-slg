name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build binaries
        run: |
          make build
          make build-gm
      - name: Unit tests
        run: make test
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
      - name: Smoke boot server wiring
        env:
          DATABASE_URL: postgres://sanguo:sanguo@localhost:5432/sanguo?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: go run ./cmd/gm
