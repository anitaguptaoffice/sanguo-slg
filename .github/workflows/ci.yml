name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked client dependencies
        run: npm ci
      - name: Typecheck and bundle client
        run: npm run build
      - name: Run client regression tests
        run: npm test

  build-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check Recruit cleanup Go formatting
        shell: bash
        run: |
          set -euo pipefail
          go version
          gofmt="$(go env GOROOT)/bin/gofmt"
          test -x "$gofmt"
          go version "$gofmt"
          git rev-parse HEAD HEAD^{tree}
          git ls-files -z -- 'internal/api/recruit_cleanup*.go' > "$RUNNER_TEMP/recruit-cleanup-files"
          mapfile -d '' -t files < "$RUNNER_TEMP/recruit-cleanup-files"
          test "${#files[@]}" -gt 0
          git ls-files --error-unmatch -- internal/api/recruit_cleanup_failure_guard_test.go \
            internal/api/recruit_cleanup_panic_process_pg_test.go > /dev/null
          git diff --cached --exit-code HEAD -- 'internal/api/recruit_cleanup*.go'
          git diff --exit-code HEAD -- 'internal/api/recruit_cleanup*.go'
          git ls-tree -r HEAD -- "${files[@]}"
          sha256sum -- "${files[@]}"
          unformatted="$("$gofmt" -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Recruit cleanup sources:\n%s\n' "$unformatted"
            "$gofmt" -d "${files[@]}"
            exit 1
          fi
          printf 'Verified official Go formatting for %s tracked Recruit cleanup sources\n' "${#files[@]}"
      - name: Check fresh DOM catalog evidence verifier
        run: python3 -m unittest discover -s .github/scripts -p test_dom_fresh_catalog_gate.py -v
      - name: Check fresh DOM catalog Go formatting and identity
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/dom-fresh-catalog"
          mkdir -p "$evidence"
          goroot="$(go env GOROOT)"
          test -n "$goroot"
          gofmt="$goroot/bin/gofmt"
          files=(internal/domestic/fresh_source_catalog.go
                 internal/domestic/fresh_city_catalog.go
                 internal/domestic/fresh_source_catalog_test.go
                 internal/domestic/fresh_source_catalog_pg_test.go
                 internal/domestic/fresh_source.go
                 internal/domestic/fresh_template.go
                 internal/domestic/fresh_source_test.go
                 internal/domestic/fresh_source_binding_pg_test.go
                 internal/domestic/fresh_source_pins_pg_test.go
                 internal/domestic/fresh_template_codec.go
                 internal/domestic/fresh_template_codec_fuzz_test.go
                 internal/domestic/fresh_template_codec_golden_test.go
                 internal/domestic/fresh_template_codec_negative_test.go
                 internal/domestic/fresh_template_codec_oracle_test.go
                 internal/domestic/fresh_template_codec_test.go)
          identity_files=("${files[@]}"
                          spec/rules/fixtures/fresh_city_template_codec_v1.json)
          {
            go version
            test -x "$gofmt"
            printf 'gofmt path: %s\n' "$gofmt"
            go version "$gofmt"
            sha256sum "$gofmt"
            commit="$(git rev-parse --verify HEAD)"
            tree="$(git rev-parse --verify "$commit^{tree}")"
            git cat-file commit "$commit" > "$RUNNER_TEMP/dom-fresh-commit.raw"
            commit_data="$(cat "$RUNNER_TEMP/dom-fresh-commit.raw")"
            [[ "$commit" =~ ^[0-9a-f]{40}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
            [[ "${commit_data%%$'\n'*}" == "tree $tree" ]]
            printf 'commit %s\n' "$commit"
            while IFS= read -r line; do
              [[ -n "$line" ]] || break
              case "$line" in
                tree\ *) printf '%s\n' "$line" ;;
                parent\ *)
                  [[ "${line#parent }" =~ ^[0-9a-f]{40}$ ]]
                  printf '%s\n' "$line"
                  ;;
              esac
            done <<< "$commit_data"
            tracked="$(git ls-files --error-unmatch -- "${identity_files[@]}")"
            git diff --cached --exit-code "$commit" -- "${identity_files[@]}"
            git diff --exit-code "$commit" -- "${identity_files[@]}"
            entries="$(git ls-tree -r "$commit" -- "${identity_files[@]}")"
            hashes="$(sha256sum -- "${identity_files[@]}")"
            python3 - "$tracked" "$entries" "$hashes" \
              "$commit" "$RUNNER_TEMP/dom-fresh-commit.raw" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".github/scripts")
          from dom_fresh_catalog_gate import check_identity, check_sources
          check_sources(Path.cwd())
          check_identity(Path.cwd(), *sys.argv[1:])
          PY
            printf '%s\n' "$tracked" "$entries" "$hashes"
          } | tee "$evidence/identity.txt"
          "$gofmt" -l "${files[@]}" | tee "$evidence/gofmt.list"
          "$gofmt" -d "${files[@]}" > "$evidence/gofmt.diff"
          test ! -s "$evidence/gofmt.list"
      - name: Build binaries
        run: |
          make build
          make build-gm
      - name: Unit tests
        run: make test
      - name: Domestic PostgreSQL regressions (ordinary and race)
        shell: bash
        run: |
          set -euo pipefail
          for mode in ordinary race; do
            flags=()
            if [[ "$mode" == race ]]; then flags=(-race); fi
            # Legacy fixtures use public; isolate the two runs in disposable DBs.
            docker exec "${{ job.services.postgres.id }}" psql -U sanguo -d sanguo \
              -v ON_ERROR_STOP=1 -c "CREATE DATABASE domestic_$mode"
            log="$RUNNER_TEMP/dom-fresh-catalog/domestic-$mode.json"
            # Physical restart has a separate two-phase harness; do not claim it.
            DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/domestic_$mode?sslmode=disable" \
            go test ./internal/domestic "${flags[@]}" -count=1 -timeout=5m \
              -skip '^TestPGQueuePhysicalRestart$' -json | tee "$log"
            python3 - "$log" <<'PY'
          import json
          import sys

          expected = {
              "TestBuildPendingRejectsWithoutMutation",
              "TestBuildPendingAllowsOtherSlotsAndCompletedUpgrade",
              "TestPGPendingBuildConcurrentStaleHubs",
              "TestPGPendingBuildFirstConstructionAndCompletion",
              "TestPGPendingBuildRollbackDoesNotReserveSlot",
          }
          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          skipped = [event.get("Test", "package") for event in events if event["Action"] == "skip"]
          failed = [event.get("Test", "package") for event in events if event["Action"] == "fail"]
          passed = {event.get("Test") for event in events if event["Action"] == "pass"}
          missing = sorted(expected - passed)
          if skipped or failed or missing or None not in passed:
              raise SystemExit(f"PG gate failed: skipped={skipped}, failed={failed}, missing={missing}")
          print(f"Verified all {len(expected)} building-pending tests with zero skips: {sys.argv[1]}")
          PY
            python3 .github/scripts/dom_fresh_catalog_gate.py "$mode" "$log"
          done
      - name: Archive fresh DOM catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-fresh-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dom-fresh-catalog/domestic-ordinary.json
            ${{ runner.temp }}/dom-fresh-catalog/domestic-race.json
            ${{ runner.temp }}/dom-fresh-catalog/identity.txt
            ${{ runner.temp }}/dom-fresh-catalog/gofmt.list
            ${{ runner.temp }}/dom-fresh-catalog/gofmt.diff
          if-no-files-found: error
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
      - name: Smoke boot server wiring
        env:
          DATABASE_URL: postgres://sanguo:sanguo@localhost:5432/sanguo?sslmode=disable
          REDIS_ADDR: localhost:6379
        run: go run ./cmd/gm
