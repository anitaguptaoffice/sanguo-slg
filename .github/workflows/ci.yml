name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.resolve.outputs.client }}
      go: ${{ steps.resolve.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - 'spec/proto/**'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'cmd/**'
              - 'tools/**'
              - 'spec/**'
              - '.github/**'
              - 'docker-compose.yml'
      - id: resolve
        env:
          FULL_MATRIX: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          F_CLIENT: ${{ steps.filter.outputs.client }}
          F_GO: ${{ steps.filter.outputs.go }}
        run: |
          set -euo pipefail
          if [ "$FULL_MATRIX" = true ]; then
            echo client=true >> "$GITHUB_OUTPUT"
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "client=${F_CLIENT:-false}" >> "$GITHUB_OUTPUT"
            echo "go=${F_GO:-false}" >> "$GITHUB_OUTPUT"
          fi

  client-build-test:
    needs: scope
    if: needs.scope.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install locked client dependencies
        run: npm ci
      - name: Typecheck and bundle client
        run: npm run build
      - name: Run client regression tests
        run: npm test

  go-build-test-lint:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Check gofmt across the repository
        shell: bash
        run: |
          set -euo pipefail
          go version
          gofmt="$(go env GOROOT)/bin/gofmt"
          test -x "$gofmt"
          unformatted="$("$gofmt" -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Unformatted Go sources:\n%s\n' "$unformatted"
            exit 1
          fi
          printf 'Verified gofmt for the whole repository\n'
      - name: Build binaries
        run: |
          make build
          make build-gm
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -short -count=1 -timeout=10m ./...

  go-pg-tests:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://sanguo:sanguo@localhost:5432/sanguo?sslmode=disable
      REDIS_ADDR: localhost:6379
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: PostgreSQL domain integration tests
        timeout-minutes: 40
        run: |
          set -euo pipefail
          # Packages share one warm fixture schema; running them in parallel makes
          # fixed test player ids collide. Serialize packages, keep the schema warm.
          go test -count=1 -p 1 -timeout=38m \
            ./internal/account \
            ./internal/api \
            ./internal/content/mail \
            ./internal/domestic \
            ./internal/military/... \
            ./internal/platform/recruittx \
            ./internal/platform/runtime \
            ./internal/platform/shard \
            ./internal/quest \
            ./internal/world
      - name: PostgreSQL hero tests (disposable schema)
        timeout-minutes: 10
        env:
          SANGUO_PG_REUSE_SPEC: "0"
        run: go test -count=1 -timeout=8m ./internal/hero
      - name: Boot server and check health
        timeout-minutes: 5
        run: |
          set -euo pipefail
          go build -o bin/server ./cmd/server
          DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/sanguo?sslmode=disable" \
          REDIS_ADDR=localhost:6379 \
          ./bin/server > /tmp/server.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          kill "$pid"
          wait "$pid" || true

  lint:
    needs: scope
    if: needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
