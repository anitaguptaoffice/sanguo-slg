name: Live hero default layout acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/live-hero-layout.yml'
      - '.github/scripts/live_hero_layout.mjs'
      - '.github/scripts/LIVE_HERO_LAYOUT.md'
permissions:
  contents: read
jobs:
  live-hero-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [1280, 1600]
        product: [standalone, reentry]
        include:
          - product: standalone
            head: 55f0253b2246616b4d1e5f3c8b902a798236a36e
            tree: 2ecf0f945fc333183805693268806d404f018fc4
            parents: d9c84df4b99794f6a8743bcfc7406ef09971bfaf
          - product: reentry
            head: 9cc49edb479b2205104109c7999a9864bd870746
            tree: 44f15f76f6eed68ef43313f4d914599ec518adf1
            parents: 55f0253b2246616b4d1e5f3c8b902a798236a36e
    env:
      QA_WIDTH: ${{ matrix.width }}
      QA_PRODUCT: ${{ matrix.product }}
      QA_PRODUCT_HEAD: ${{ matrix.head }}
      QA_PRODUCT_TREE: ${{ matrix.tree }}
      QA_PRODUCT_PARENTS: ${{ matrix.parents }}
      QA_RUNTIME_HEAD: 7dc5939f9753a8aa59c94f7101c62a8e4a8eda79
      QA_GEOMETRY_HEAD: 283160ae6f9970ff396383ae6815ed9783c64753
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: live_hero_layout
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanguo -d live_hero_layout"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Initialize failure evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '{"passed":false,"phase":"setup; inspect job logs"}\n' > evidence/preflight.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: qa-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7dc5939f9753a8aa59c94f7101c62a8e4a8eda79
          path: runtime-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_GEOMETRY_HEAD }}
          path: geometry-source
          fetch-depth: 2
          persist-credentials: false
      - name: Assert exact independently reviewed inputs
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$QA_PRODUCT_TREE"
          test "$(git show -s --format=%P HEAD)" = "$QA_PRODUCT_PARENTS"
          test -z "$(git status --porcelain)"
          test "$(git -C ../runtime-source rev-parse HEAD)" = "$QA_RUNTIME_HEAD"
          test "$(git -C ../runtime-source rev-parse HEAD^{tree})" = dc151c5513ea2a2d937e45d4dee12d9f59792c7e
          test -z "$(git -C ../runtime-source status --porcelain)"
          test "$(git -C ../geometry-source rev-parse HEAD)" = "$QA_GEOMETRY_HEAD"
          test "$(git -C ../geometry-source rev-parse HEAD^{tree})" = 5a731de39fec4e35ea120f83492f8d5c93bf4841
          test "$(git -C ../geometry-source show -s --format=%P HEAD)" = 757e43a9f40d7c92ded6a536ec334de94d69ff6f
          test -z "$(git -C ../geometry-source status --porcelain)"
          git -C ../geometry-source show -s --format='{"head":"%H","tree":"%T","parents":"%P"}' HEAD > ../evidence/geometry-provenance.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: target/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/client/package-lock.json
      - name: Run complete runtime and geometry negative controls
        working-directory: target/client
        run: |
          set -euo pipefail
          cp ../../runtime-source/.github/scripts/live_hero_layout_runtime.mjs .
          cp ../../qa-source/.github/scripts/live_hero_layout.mjs .qa-live-hero-layout.mjs
          cp ../../geometry-source/.github/scripts/live_hero_layout_geometry.mjs .
          cmp live_hero_layout_runtime.mjs ../../runtime-source/.github/scripts/live_hero_layout_runtime.mjs
          node ../../runtime-source/.github/scripts/live_hero_layout_runtime.test.mjs | tee ../../evidence/runtime-tests.log
          cmp live_hero_layout_geometry.mjs ../../geometry-source/.github/scripts/live_hero_layout_geometry.mjs
          node ../../geometry-source/.github/scripts/live_hero_layout_geometry.test.mjs | tee ../../evidence/geometry-helper-tests.log
          node .qa-live-hero-layout.mjs --self-test | tee ../../evidence/geometry-tests.log
      - name: Build actual server and test complete client
        timeout-minutes: 10
        working-directory: target
        env:
          GOTOOLCHAIN: local
          VITE_GATEWAY_WS_URL: ws://127.0.0.1:8080/ws
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/live-hero-layout-server" ./cmd/server 2>&1 | tee ../evidence/build-server.log
          cd client
          npm ci 2>&1 | tee ../../evidence/install.log
          npm test 2>&1 | tee ../../evidence/client-tests.log
          npm run build 2>&1 | tee ../../evidence/client-build.log
          npx --no-install playwright install --with-deps chromium
      - name: Verify every required native UI case
        working-directory: target/client
        env:
          QA_OUT: ${{ github.workspace }}/evidence
          QA_SERVER: ${{ runner.temp }}/live-hero-layout-server
          DATABASE_URL: postgres://sanguo:sanguo@127.0.0.1:5432/live_hero_layout?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          PGHOST: 127.0.0.1
          PGUSER: sanguo
          PGPASSWORD: sanguo
          PGDATABASE: live_hero_layout
        run: node .qa-live-hero-layout.mjs
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-hero-layout-${{ matrix.product }}-${{ matrix.width }}-${{ github.event.pull_request.head.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
