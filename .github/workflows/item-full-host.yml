name: Item full host art
on:
  pull_request:
    paths: ['.github/workflows/item-full-host.yml', 'client/qa/itemFullHost.browser.mjs', 'client/qa/ITEM-FULL-HOST.md']
jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ed32cae751646723ac242849f16a9acb034c8eb4
          fetch-depth: 0
          persist-credentials: false
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compose immutable source without publishing
        run: |
          cd target
          git -c user.name=QA -c user.email=qa@example.invalid merge --no-ff 005e51ed6b56b81c007b4f546831889fb84082a2 -m 'Disposable item host QA'
          test "$(git rev-parse HEAD^{tree})" = ef563a5746ec7b8b529030656f73d2660658921a
          cp ../harness/client/qa/itemFullHost.browser.mjs client/qa/
      - name: Install official locked dependencies
        working-directory: target/client
        run: npm ci && npx --no-install playwright install --with-deps chromium
      - name: Test full host with local mock service
        working-directory: target/client
        env:
          QA_OUT: ${{ runner.temp }}/item-full-host
        run: node qa/itemFullHost.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-1280-dpr1-${{ github.sha }}
          path: ${{ runner.temp }}/item-full-host/1280-dpr1-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-1280-dpr1.5-${{ github.sha }}
          path: ${{ runner.temp }}/item-full-host/1280-dpr1.5-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-1280-dpr2-${{ github.sha }}
          path: ${{ runner.temp }}/item-full-host/1280-dpr2-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-1600-dpr1-${{ github.sha }}
          path: ${{ runner.temp }}/item-full-host/1600-dpr1-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-1600-dpr1.5-${{ github.sha }}
          path: ${{ runner.temp }}/item-full-host/1600-dpr1.5-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-1600-dpr2-${{ github.sha }}
          path: ${{ runner.temp }}/item-full-host/1600-dpr2-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: item-host-report-${{ github.sha }}
          path: |
            ${{ runner.temp }}/item-full-host/*.json
            ${{ runner.temp }}/item-full-host/*.log
            ${{ runner.temp }}/item-full-host/1280-missing*.png
            ${{ runner.temp }}/item-full-host/1280-dom*.png
            ${{ runner.temp }}/item-full-host/failure.png
