name: March return PostgreSQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  march-pg-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Verify PostgreSQL 17 and host toolchain
        shell: bash
        run: |
          go version
          command -v psql
          psql --version
          version=$(docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -Atc "SHOW server_version_num")
          [[ "$version" =~ ^[0-9]+$ ]]
          (( version / 10000 == 17 ))
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -c "SELECT version()"
      - name: Check MARCH source formatting
        shell: bash
        run: |
          files=$(gofmt -l internal/military/march/recruit_pending_read.go \
            internal/military/march/recruit_prepare.go internal/military/march/recruit_pending_read_pg_test.go \
            internal/military/march/return_catalog.go internal/military/march/return_catalog_test.go \
            internal/military/march/return_catalog_pg_test.go \
            internal/military/march/return_source.go internal/military/march/return_source_test.go \
            internal/military/march/return_source_pg_test.go \
            internal/military/march/return_locked.go internal/military/march/return_locked_test.go \
            internal/military/march/return_locked_pg_test.go \
            internal/military/march/return_atomic.go internal/military/march/return_atomic_test.go \
            internal/military/march/return_atomic_pg_test.go internal/military/march/return_atomic_concurrency_pg_test.go \
            internal/military/march/return_atomic_guards_pg_test.go)
          if [[ -n "$files" ]]; then
            printf 'Unformatted MARCH source:\n%s\n' "$files"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Run full MARCH regressions (ordinary and race)
        shell: bash
        run: |
          for mode in ordinary race; do
            flags=()
            if [[ "$mode" == race ]]; then flags=(-race); fi
            # Each mode owns a fresh database; PG fixtures isolate their schemas.
            docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
              -v ON_ERROR_STOP=1 -c "CREATE DATABASE march_$mode"
            log="$RUNNER_TEMP/march-$mode.json"
            DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/march_$mode?sslmode=disable" \
            go test ./internal/military/march "${flags[@]}" -count=1 -timeout=10m -json | tee "$log"
            python3 - "$log" "$mode" <<'PY'
          import json
