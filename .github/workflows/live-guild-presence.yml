name: Live guild presence native acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/live-guild-presence.yml'
      - '.github/scripts/live_guild_presence.mjs'
      - '.github/scripts/LIVE_GUILD_PRESENCE.md'
      - '.github/scripts/live_guild_presence.test.mjs'
permissions:
  contents: read
jobs:
  live-guild-presence:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        product: [baseline, fixed]
        width: [1280, 1600]
        include:
          - product: baseline
            head: 757e43a9f40d7c92ded6a536ec334de94d69ff6f
            tree: cb3162ade8e15a9ab361b8f2d54ced1f5ea36d40
            parents: e2b60dda830d9b25f15fcfced4da4acc090a8f1c
          - product: fixed
            head: 00b292a9c1f7ab3ec5d6c868c8667cbcf03681bc
            tree: 1949038fc542b545a229de4bcf96c86580a08514
            parents: 757e43a9f40d7c92ded6a536ec334de94d69ff6f
    env:
      QA_WIDTH: ${{ matrix.width }}
      QA_QA_HEAD: ${{ github.event.pull_request.head.sha }}
      QA_PRODUCT: ${{ matrix.product }}
      QA_PRODUCT_HEAD: ${{ matrix.head }}
      QA_PRODUCT_TREE: ${{ matrix.tree }}
      QA_PRODUCT_PARENTS: ${{ matrix.parents }}
      QA_HELPER_PARENTS: 757e43a9f40d7c92ded6a536ec334de94d69ff6f
      QA_RUNTIME_HEAD: 15f75cda10c468cb2616dcdcfff5adefbf3d8b74
      QA_RUNTIME_TREE: 36396bb8b70a7805d9d8e058c85f5a1d04d49355
      QA_RUNTIME_PARENTS: 757e43a9f40d7c92ded6a536ec334de94d69ff6f
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: live_guild_presence
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanguo -d live_guild_presence"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Initialize failure evidence
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '{"passed":false,"phase":"setup; inspect job logs"}\n' > evidence/preflight.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: qa-source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7dc5939f9753a8aa59c94f7101c62a8e4a8eda79
          path: runtime-source
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_RUNTIME_HEAD }}
          path: guild-runtime-source
          fetch-depth: 2
          persist-credentials: false
      - name: Assert exact independently reviewed inputs
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QA_PRODUCT_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$QA_PRODUCT_TREE"
          test "$(git show -s --format=%P HEAD)" = "$QA_PRODUCT_PARENTS"
          test -z "$(git status --porcelain)"
          test "$(git -C ../qa-source rev-parse HEAD)" = "$QA_QA_HEAD"
          test -z "$(git -C ../qa-source status --porcelain)"
          git -C ../qa-source show -s --format='{"head":"%H","tree":"%T","parents":"%P"}' HEAD > ../evidence/qa-provenance.json
          test "$(git -C ../runtime-source rev-parse HEAD)" = 7dc5939f9753a8aa59c94f7101c62a8e4a8eda79
          test "$(git -C ../runtime-source rev-parse HEAD^{tree})" = dc151c5513ea2a2d937e45d4dee12d9f59792c7e
          test "$(git -C ../runtime-source show -s --format=%P HEAD)" = "$QA_HELPER_PARENTS"
          test -z "$(git -C ../runtime-source status --porcelain)"
          test "$(git -C ../guild-runtime-source rev-parse HEAD)" = "$QA_RUNTIME_HEAD"
          test "$(git -C ../guild-runtime-source rev-parse HEAD^{tree})" = "$QA_RUNTIME_TREE"
          test "$(git -C ../guild-runtime-source show -s --format=%P HEAD)" = "$QA_RUNTIME_PARENTS"
          test -z "$(git -C ../guild-runtime-source status --porcelain)"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache-dependency-path: target/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: target/client/package-lock.json
      - name: Build actual server and test complete client
        timeout-minutes: 10
        working-directory: target
        env:
          GOTOOLCHAIN: local
          VITE_GATEWAY_WS_URL: ws://127.0.0.1:8080/ws
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/live-guild-presence-server" ./cmd/server 2>&1 | tee ../evidence/build-server.log
          cd client
          npm ci 2>&1 | tee ../../evidence/install.log
          npm test 2>&1 | tee ../../evidence/client-tests.log
          npm run build 2>&1 | tee ../../evidence/client-build.log
          npx --no-install playwright install --with-deps chromium
      - name: Run complete immutable helper and guild negative controls
        working-directory: target/client
        run: |
          set -euo pipefail
          for file in live_hero_layout_runtime.mjs live_hero_layout_runtime.test.mjs; do
            cp "../../runtime-source/.github/scripts/$file" .
            cmp "$file" "../../runtime-source/.github/scripts/$file"
          done
          for file in live_guild_presence_runtime.mjs live_guild_presence_runtime.test.mjs; do
            cp "../../guild-runtime-source/.github/scripts/$file" .
            cmp "$file" "../../guild-runtime-source/.github/scripts/$file"
          done
          for file in live_guild_presence.mjs live_guild_presence.test.mjs; do
            cp "../../qa-source/.github/scripts/$file" .
            cmp "$file" "../../qa-source/.github/scripts/$file"
          done
          test -z "$(git diff --name-only)"
          printf '%s\n' live_guild_presence.mjs live_guild_presence.test.mjs live_guild_presence_runtime.mjs live_guild_presence_runtime.test.mjs live_hero_layout_runtime.mjs live_hero_layout_runtime.test.mjs | sort > ../../evidence/expected-staging.txt
          git ls-files --others --exclude-standard | sort > ../../evidence/actual-staging.txt
          cmp ../../evidence/expected-staging.txt ../../evidence/actual-staging.txt
          node live_hero_layout_runtime.test.mjs | tee ../../evidence/helper-tests.log
          node live_guild_presence_runtime.test.mjs | tee ../../evidence/runtime-tests.log
          node live_guild_presence.test.mjs | tee ../../evidence/scenario-tests.log
      - name: Verify every required native UI case
        working-directory: target/client
        env:
          QA_OUT: ${{ github.workspace }}/evidence
          QA_SERVER: ${{ runner.temp }}/live-guild-presence-server
          DATABASE_URL: postgres://sanguo:sanguo@127.0.0.1:5432/live_guild_presence?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
          PGHOST: 127.0.0.1
          PGUSER: sanguo
          PGPASSWORD: sanguo
          PGDATABASE: live_guild_presence
        run: node live_guild_presence.mjs
      - name: Preserve all evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-guild-presence-${{ matrix.product }}-${{ matrix.width }}-${{ github.event.pull_request.head.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
