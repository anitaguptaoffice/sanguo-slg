              "TestPGRecruitAttemptDeferredCommitFailure",
              "TestPGRecruitAttemptConcurrentCommandReplay",
              "TestPGRecruitAttemptNetworkUncertainty",
          }
          companion_groups = {
              "TestPGRecruitAttemptBusinessFailures": ("unsupported_version", "insufficient_funds"),
              "TestPGRecruitAttemptConcurrentCommandReplay": ("same_intent", "conflicting_count"),
              "TestPGRecruitAttemptNetworkUncertainty": (
                  "normal_reply", "lost_acknowledgement", "fragmented_lost_acknowledgement", "cut_before_commit",
              ),
          }
          companions.update(f"{parent}/{child}" for parent, children in companion_groups.items() for child in children)
          if len(companions) != 13 or companions & {name for _, name in required}:
              raise SystemExit("Frozen Recruit companion inventory changed")
          required.update((root, name) for name in companions)
          if len(required) != (189 if phase == "preflight" else 414):
              raise SystemExit("Combined military-attempt inventory changed")
          # Final pre-runtime composition ac5c96eb adds only #2193 confirmed lifetime.
          confirmed_lifetime = {
              "TestPGRecruitAttemptConfirmedLifetime",
              "TestPGRecruitAttemptConfirmedLifetime/close",
              "TestPGRecruitAttemptConfirmedLifetime/missing_record",
          }
          if len(confirmed_lifetime) != 3 or confirmed_lifetime & {name for _, name in required}:
              raise SystemExit("Frozen confirmed-lifetime inventory changed")
          required.update((root, name) for name in confirmed_lifetime)
          if len(required) != (192 if phase == "preflight" else 417):
              raise SystemExit("Final military-attempt inventory changed")
          # Preserve the final-main calendar outcomes alongside every prior frozen set.
          calendar_required = {(root, name) for name in (
              "TestSmokeDailyCalendarClockPG",
              "TestSmokeDailyCalendarClockPG/default_calendar_restart",
              "TestSmokeDailyCalendarClockPG/explicit_UTC_midnight",
          )}
          if required & calendar_required:
              raise SystemExit("Calendar evidence duplicates the prior frozen inventory")
          required |= calendar_required
          if len(required) != (195 if phase == "preflight" else 420):
              raise SystemExit("Final-main API union inventory changed")
          # Approved fixture-boundary repair adds three real shared-backend consumers.
          backend_required = {(root, name) for name in (
              "TestReturnBackendJoinBoundaries",
              "TestReturnBackendCloseOncePreservesError",
              "TestPGReturnBackendCaptureAndCleanupIsolation",
          )}
          if required & backend_required:
              raise SystemExit("Backend boundary evidence duplicates the frozen inventory")
          required |= backend_required
          if len(required) != (198 if phase == "preflight" else 423):
              raise SystemExit("Backend boundary union inventory changed")
          # Recruit end extraction preserves all previous required outcomes.
          end_groups = {
              "TestRecruitAttemptEndClassification": (
                  "before_begin", "exact_business_error", "wrapped_business_error",
                  "begin_without_owner", "begin_failure", "cleanup_error",
                  "unknown_cause", "phase_alone_not_unknown", "pre_begin_panic",
                  "commit_panic", "panic_and_cleanup_error", "confirmed_skips_cleanup",
                  "confirmed_survives_fault", "confirmed_survives_unknown_cause",
              ),
              "TestRecruitAttemptEndConfirmedBookkeeping": ("record", "lease"),
              "TestRecruitAttemptEndPanicPriority": (),
          }
          end_required = {(root, parent) for parent in end_groups}
          end_required.update((root, f"{parent}/{child}") for parent, children in end_groups.items() for child in children)
          if len(end_required) != 19 or required & end_required:
              raise SystemExit("Recruit end evidence duplicates or changes the frozen inventory")
          required |= end_required
          if len(required) != (217 if phase == "preflight" else 442):
              raise SystemExit("Recruit end union inventory changed")
          # Actual dormant completion adds to every inherited acceptance gate.
          completion_roots = {
              "TestRecruitCompletionPreflight",
              "TestRecruitCompletionDisposition",
              "TestRecruitCompletionBookkeeping",
              "TestRecruitCompletionSQLWitness",
              "TestPGRecruitCompletionPaidDue",
          }
          completion_required = {(root, name) for name in completion_roots}
          completion_required.update(
              (root, f"TestRecruitCompletionBookkeeping/{outcome}/{loss}")
              for outcome in ("completed", "done", "early", "waiting", "unknown", "unavailable")
              for loss in ("none", "record", "lease")
          )
          if len(completion_required) != 23 or required & completion_required:
              raise SystemExit("Completion evidence duplicates or changes the frozen inventory")
          required |= completion_required
          if len(required) != (240 if phase == "preflight" else 465):
              raise SystemExit("Completion union inventory changed")
          tested_packages = {package for package, _ in required}
          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          observed = {event.get("Package") for event in events}
          passed = {
              (event.get("Package"), event["Test"]) for event in events
              if event["Action"] == "pass" and event.get("Test")
          }
          bad = [
              event for event in events
              if event["Action"] == "fail" or event["Action"] == "skip"
              and (event.get("Test") or event.get("Package") not in no_tests)
              or event.get("Package") in no_tests and "Test" in event
          ]
          for package in tested_packages | no_tests:
              terminal = [
                  event["Action"] for event in events
                  if event.get("Package") == package and not event.get("Test")
                  and event["Action"] in {"pass", "skip", "fail"}
              ]
              wanted = ["skip"] if package in no_tests else ["pass"]
              if terminal != wanted:
                  bad.append({"package": package, "terminal": terminal})
              if package in no_tests and not any(
                  event.get("Package") == package and "Test" not in event
                  and event["Action"] == "output"
                  and event.get("Output") == f"?   \t{package}\t[no test files]\n"
                  for event in events
              ):
                  bad.append({"package": package, "missing_no_test_files_output": True})
          started = {
              (event.get("Package"), event["Test"]) for event in events
              if event["Action"] == "run" and event.get("Test")
          }
          unfinished = sorted(started - passed)
          missing = sorted(required - passed)
          if bad or missing or unfinished or observed != tested_packages | no_tests:
              raise SystemExit(f"API PG gate failed: bad={bad}, missing={missing}, unfinished={unfinished}, observed={observed}")
          # The isolated child has no root Go test events. Require the parent's final
          # confirmation after its structured witness and independent cleanup checks.
          cleanup_confirmation = "verified primary/live/unknown/retained slot, actual pool closing and isolated teardown; not graceful drain"
          cleanup_outputs = [
              event for event in events
              if event.get("Package") == root and event.get("Test") == "TestPGRecruitGenerationConstructorCleanupPanic"
              and event["Action"] == "output" and event.get("Output", "").rstrip().endswith(": " + cleanup_confirmation)
          ]
          if len(cleanup_outputs) != 1:
              raise SystemExit("Missing or duplicate parent confirmation of isolated cleanup-panic evidence")
          top_level = sum("/" not in name for _, name in passed)
          print(f"{sys.argv[2]}/{phase}: {top_level} top-level / {len(passed)} including subtests PASS")
          print(f"Verified {len(required)} required tests/scenarios and all {len(tested_packages)} tested-package PASS events")
          print(f"Zero skipped tests or failures; {len(no_tests)} packages have no test files (Go package-only skip)")
          print("Optional t.Log branches are not full gameplay coverage; their actual output is preserved above")
          print("\n".join(f"{package}: {name}" for package, name in sorted(required)))
          PY
      - name: Verify isolated backend behavioral witnesses
        timeout-minutes: 5
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 - <<'PY_BACKEND'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          mode = os.environ["MODE"]
          assert mode in {"ordinary", "race"}
          root = Path.cwd()
          package = "github.com/anitaguptaoffice/sanguo-slg/internal/api"
          fixture = "internal/api/return_attempt_lifetime_fixture_test.go"
          tests_file = "internal/api/return_attempt_backend_cleanup_test.go"
          flags = ["-race"] if mode == "race" else []
          targets = ["TestReturnBackendJoinBoundaries", "TestReturnBackendCloseOncePreservesError",
                     "TestPGReturnBackendCaptureAndCleanupIsolation"]
          # Four precise assertion witnesses only. Bounded-readonly timeout variants are unproven.
          mutations = [
              ("join", targets[0], "case <-timer.C:\n\t\treturn false", "case <-timer.C:\n\t\treturn true",
               "unfinished caller reported joined"),
              ("capture", targets[2], "b.pid == 0 || b.transport == nil || r.backends[b.pid] != nil",
               "b.pid == 0 || b.transport == nil", "duplicate capture replaced original ownership"),
              ("once", targets[1], "b.once.Do(func() { b.err = b.transport.Close() })",
               "b.err = b.transport.Close()", "owned transport closed more than once"),
              ("error", targets[1], "return b.err", "return nil", "original close failure lost"),
          ]

          mutation_hashes = {
              "join": "da6353b9ea4972a0d50ebaad0d8c54c20d689f3aaed6859f5bb1fd9f57020b9e",
              "capture": "4284fdfff97203d47c692f5e89e73923efdba527fe0c4b95dc6a5beba7063737",
              "once": "1e610d6a8806095747d208f4a3bfc446c4fa3c44c133fa2a1ba3ba392e1c9695",
              "error": "0981e23a8fb1f4dfcc2cfeccb466ed497f64668dd02dc1aa53173a4171923b02",
          }

          def git(*args, cwd=root):
              return subprocess.check_output(["git", *args], cwd=cwd, text=True).strip()

          assert not git("status", "--porcelain")
          head = git("rev-parse", "HEAD")
          assert git("rev-parse", f"HEAD:{fixture}") == "d238706891236c1261c5bff89d59af2c5ad3025f"
          assert git("rev-parse", f"HEAD:{tests_file}") == "280977c4373facccbcbbd38f06cfeb42aaea3912"

          def run(case, phase, directory, environment, names, needle=""):
              selector = "^(" + "|".join(names) + ")$" if names else "^$"
              args = ["go", "test", "./internal/api", *flags, "-run", selector,
                      "-count=1", "-timeout=60s", "-json"]
              print(f"BACKEND_WITNESS {mode}/{case}/{phase} START {args}", flush=True)
              result = subprocess.run(args, cwd=directory, env=environment, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=90)
              Path(os.environ["RUNNER_TEMP"], f"backend-{mode}-{case}-{phase}.json").write_text(result.stdout)
              print(result.stdout, end="", flush=True)
              assert result.returncode == (1 if needle else 0), (case, phase, result.returncode)
              events = [json.loads(line) for line in result.stdout.splitlines() if line.strip()]
              assert events and {e.get("Package") for e in events} == {package}
              assert not any(e["Action"] == "skip" for e in events)
              assert {e["Test"] for e in events if e.get("Test")} == set(names)
              terminal = "fail" if needle else "pass"
              for name in names:
                  actions = [e["Action"] for e in events if e.get("Test") == name and e["Action"] != "output"]
                  assert actions == ["run", terminal], (case, name, actions)
              package_ends = [e["Action"] for e in events if not e.get("Test") and e["Action"] in {"pass", "fail"}]
              assert package_ends == [terminal], (case, package_ends)
              forbidden = ("panic:", "fatal error:", "[build failed]", "test timed out", "deadline exceeded",
                           "sqlstate", "failed to connect", "connection refused", "unexpected eof")
              assert not any(text in result.stdout.lower() for text in forbidden)
              assert (case == "once" and phase == "negative") or "WARNING: DATA RACE" not in result.stdout
              if needle:
                  assert any(e.get("Test") == names[0] and needle in e.get("Output", "") for e in events)
              print(f"BACKEND_WITNESS {mode}/{case}/{phase} VERIFIED", flush=True)

          def exercise(case, names, mutation=None):
              directory = Path(os.environ["RUNNER_TEMP"], f"backend-checkout-{mode}-{case}")
              database = f"backend_witness_{mode}_{case}"
              subprocess.run(["docker", "exec", os.environ["PG_CONTAINER"], "psql", "-X", "-U", "sanguo",
                              "-d", "sanguo", "-v", "ON_ERROR_STOP=1", "-c", f"CREATE DATABASE {database}"], check=True)
              git("worktree", "add", "--detach", str(directory), head)
              path = directory / fixture
              original = path.read_text()
              environment = dict(os.environ, DATABASE_URL=f"postgres://sanguo:sanguo@localhost:5432/{database}?sslmode=disable")
              try:
                  assert not git("status", "--porcelain", cwd=directory)
                  if mutation:
                      _, _, before, after, needle = mutation
                      assert original.count(before) == 1
                      path.write_text(original.replace(before, after, 1))
                      assert hashlib.sha256(path.read_bytes()).hexdigest() == mutation_hashes[case]
                      assert git("diff", "--name-only", cwd=directory) == fixture
                      print(git("diff", "--", fixture, cwd=directory), flush=True)
                      run(case, "compile", directory, environment, [])
                      run(case, "negative", directory, environment, names, needle)
                  else:
                      run(case, "positive", directory, environment, names)
              finally:
                  path.write_text(original)
                  assert not git("status", "--porcelain", cwd=directory)
                  git("worktree", "remove", str(directory))
              assert git("rev-parse", "HEAD") == head and not git("status", "--porcelain")

          exercise("positive", targets)
          for mutation in mutations:
              exercise(mutation[0], [mutation[1]], mutation)
          print(f"BACKEND_WITNESS {mode}: clean positive and four precise behavioral negatives verified")
          PY_BACKEND
      - name: Run full API regressions without short mode
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [[ "$MODE" == race ]]; then flags=(-race); fi
          gate="$RUNNER_TEMP/api-gate.py"
          # Preflight and full acceptance own different disposable databases.
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_preflight_$MODE"
          log="$RUNNER_TEMP/api-preflight-$MODE.json"
          DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/api_preflight_$MODE?sslmode=disable" \
          go test ./internal/api "${flags[@]}" -run '^(TestReturnSource|TestPGReturnGeneration|TestRecruitSource|TestPGRecruitGeneration|TestPGRecruitBundleCopiedAccessLifetime|TestPGRecruitBundleRejectsAccessSubstitution|TestRecruitGenerationSQLAllowlist|TestReturnSQLRecorded|TestRecruitPanicAbsenceRejectsInvalidIdentity|TestReturnAttempt|TestPGReturnAttempt|TestRecruitAttempt|TestPGRecruitAttempt|TestPGRecruitReturn|TestReturnNetworkAcknowledgementFraming|TestReturnBackendOwnershipFailClosed|TestPGReturnBackendCleanupOwnership|TestSmokeDailyCalendarClockPG$|TestReturnBackendJoinBoundaries$|TestReturnBackendCloseOncePreservesError$|TestPGReturnBackendCaptureAndCleanupIsolation$|TestRecruitCompletion|TestPGRecruitCompletionPaidDue$)' -count=1 -timeout=5m -json | tee "$log"
          python3 "$gate" "$log" "$MODE" preflight
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_$MODE"
          log="$RUNNER_TEMP/api-$MODE.json"
          DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/api_$MODE?sslmode=disable" \
          go test ./internal/api/... "${flags[@]}" -count=1 -timeout=120m -json | tee "$log"
          python3 "$gate" "$log" "$MODE" full
