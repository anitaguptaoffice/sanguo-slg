name: API return PostgreSQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-pg-test:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [ordinary, race]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Verify PostgreSQL 17 and host toolchain
        shell: bash
        run: |
          go version
          [[ "$(go env GOVERSION)" == go1.23.12 ]]
          git rev-parse HEAD HEAD^{tree}
          command -v psql
          psql --version
          version=$(docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -Atc "SHOW server_version_num")
          [[ "$version" =~ ^[0-9]+$ ]]
          (( version / 10000 == 17 ))
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -c "SELECT version()"
      - name: Check API source and SQL evidence formatting
        shell: bash
        run: |
          files=$(gofmt -l internal/api/return_source.go \
            internal/api/return_source_fixture_test.go \
            internal/api/return_source_lifetime_pg_test.go \
            internal/api/return_source_pg_test.go \
            internal/api/return_source_pins_pg_test.go \
            internal/api/return_source_test.go \
            internal/api/return_source_sql_test.go \
            internal/api/recruit_source.go \
            internal/api/recruit_source_test.go \
            internal/api/recruit_source_fixture_test.go \
            internal/api/recruit_source_pg_test.go \
            internal/api/recruit_source_lifetime_pg_test.go \
            internal/api/recruit_source_pins_pg_test.go \
            internal/api/recruit_source_access_pg_test.go \
            internal/api/recruit_cleanup_panic_process_pg_test.go \
            internal/api/recruit_attempt.go \
            internal/api/recruit_attempt_fixture_test.go \
            internal/api/recruit_attempt_failures_fixture_test.go \
            internal/api/recruit_attempt_failures_pg_test.go \
            internal/api/recruit_attempt_serialization_pg_test.go \
            internal/api/recruit_attempt_network_fixture_test.go \
            internal/api/recruit_attempt_network_pg_test.go \
            internal/api/recruit_attempt_lifetime_fixture_test.go \
            internal/api/recruit_attempt_lifetime_pg_test.go \
            internal/api/recruit_attempt_pg_test.go \
            internal/api/recruit_attempt_test.go \
            internal/api/recruit_return_interop_fixture_pg_test.go \
            internal/api/recruit_return_interop_fixture_test.go \
            internal/api/recruit_return_interop_pg_test.go \
            internal/api/return_attempt.go \
            internal/api/return_attempt_backend_cleanup_pg_test.go \
            internal/api/return_attempt_backend_cleanup_test.go \
            internal/api/return_attempt_failures_pg_test.go \
            internal/api/return_attempt_fixture_test.go \
            internal/api/return_attempt_lifetime_fixture_test.go \
            internal/api/return_attempt_lifetime_pg_test.go \
            internal/api/return_attempt_lock_order_pg_test.go \
            internal/api/return_attempt_network_fixture_test.go \
            internal/api/return_attempt_network_pg_test.go \
            internal/api/return_attempt_pg_test.go \
            internal/api/return_attempt_serialization_pg_test.go \
            internal/api/return_attempt_test.go \
            internal/platform/recruittx/commit_panic_pg_test.go \
            internal/platform/recruittx/commit_panic_test.go \
            internal/platform/recruittx/recruittx.go)
          if [[ -n "$files" ]]; then
            printf 'Unformatted API source:\n%s\n' "$files"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      # Temporary baseline witness: remove after official proof, then re-review and rerun final CI.
      - name: Prove original Return SQL helper accepts the rejected CTE
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [[ "$MODE" == race ]]; then flags=(-race); fi
          helper=internal/api/return_source_pg_test.go
          test_file=internal/api/return_source_sql_test.go
          [[ "$(git hash-object "$test_file")" == a4e6a572857d2d65676810bcfac06339258663fc ]]
          original=419fed8b5b2e36c706799909bc1eb506e0973d94
          git fetch --no-tags --depth=1 origin "$original"
          [[ "$(git rev-parse "$original:$helper")" == 94891293c6f74edf40bb0038299c16eca907fa68 ]]
          witness=$(mktemp -d "$RUNNER_TEMP/api-return-sql-original-$MODE.XXXXXX")
          # Complete compile closure: module manifests, internal packages and embedded seeds.
          # The selected synthetic case also reads frozen SQL literals under internal/.
          git archive HEAD go.mod go.sum internal | tar -x -C "$witness"
          [[ "$(git hash-object "$witness/$test_file")" == a4e6a572857d2d65676810bcfac06339258663fc ]]
          git show "$original:$helper" > "$witness/$helper"
          [[ "$(git hash-object "$witness/$helper")" == 94891293c6f74edf40bb0038299c16eca907fa68 ]]
          log="$RUNNER_TEMP/api-return-sql-original-$MODE.json"
          set +e
          (cd "$witness" && env -u DATABASE_URL -u SLG_RETURN_SQL_CHILD go test ./internal/api "${flags[@]}" \
            -run '^TestReturnSQLRecorded$/^reject$/^cte_update$' -count=1 -timeout=2m -json) | tee "$log"
          status=("${PIPESTATUS[@]}")
          set -e
          git diff --exit-code -- "$helper" "$test_file"
          [[ "${status[0]}" == 1 && "${status[1]}" == 0 ]]
          python3 - "$log" <<'PY'
          import json
          import re
          import sys

          root = "github.com/anitaguptaoffice/sanguo-slg/internal/api"
          parent = "TestReturnSQLRecorded"
          target = parent + "/reject/cte_update"
          wanted = {parent, target}
          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          if {event.get("Package") for event in events} != {root}:
              raise SystemExit("Original-helper witness reached an unrelated package")
          if {event["Test"] for event in events if event.get("Test")} != wanted:
              raise SystemExit("Original-helper witness reached unexpected or missing tests")
          for test in wanted:
              started = [event for event in events if event.get("Test") == test and event["Action"] == "run"]
              terminal = [event["Action"] for event in events if event.get("Test") == test and event["Action"] in {"pass", "skip", "fail"}]
              if len(started) != 1 or terminal != ["fail"]:
                  raise SystemExit("Original-helper witness did not fail in the selected parent and child")
          terminal = [event["Action"] for event in events if not event.get("Test") and event["Action"] in {"pass", "skip", "fail"}]
          if terminal != ["fail"]:
              raise SystemExit("Original-helper witness lacks its failed package terminal")
          output = "".join(event.get("Output", "") for event in events if event.get("Test") == target and event["Action"] == "output")
          diagnostic = r"(?m)^\s+return_source_sql_test\.go:[0-9]+: unsafe SQL was accepted or rejection was unrelated: <nil>\n\s+RETURN_SQL_ACCEPTED\n\s+PASS\n"
          if len(re.findall(diagnostic, output)) != 1:
              raise SystemExit("Missing actual old acceptance; unrelated failures are not a behavioral witness")
          if any(word in "".join(event.get("Output", "") for event in events) for word in ("panic:", "fatal error:", "WARNING: DATA RACE", "build failed")):
              raise SystemExit("Original-helper witness has an unrelated runtime or build failure")
          print("Original helper accepted synthetic cte_update: exact unchanged parent/child failed as required")
          PY
