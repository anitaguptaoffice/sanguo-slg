          # Actual Return.complete / Recruit.admit source 6221308e, not runtime activation.
          attempts = {
              "TestPGRecruitAttemptAdmissionAndReplay",
              "TestPGRecruitReturnFixtureIsolationAndPoolReuse",
              "TestPGRecruitReturnInteroperability",
              "TestPGReturnAttemptCanceledBeforeAdmission",
              "TestPGReturnAttemptCanceledPin",
              "TestPGReturnAttemptConfirmedLifetime",
              "TestPGReturnAttemptDeferredCommitFailure",
              "TestPGReturnAttemptDueAndPendingCapacity",
              "TestPGReturnAttemptDuplicateWalletWorldSerialization",
              "TestPGReturnAttemptFailedRollback",
              "TestPGReturnAttemptNetworkUncertainty",
              "TestPGReturnAttemptPanicLifetime",
              "TestPGReturnAttemptPinAndActorOrder",
              "TestPGReturnAttemptReadOnlyStates",
              "TestPGReturnAttemptRejectsReassignedHint",
              "TestPGReturnBackendCleanupOwnership",
              "TestRecruitAttemptBookkeeping",
              "TestRecruitAttemptCost",
              "TestRecruitAttemptDiagnostics",
              "TestRecruitAttemptPGSQLClassification",
              "TestRecruitAttemptPreflight",
              "TestReturnAttemptBookkeeping",
              "TestReturnAttemptErrorPolicy",
              "TestReturnAttemptObservation",
              "TestReturnAttemptPreflight",
              "TestReturnBackendOwnershipFailClosed",
              "TestReturnNetworkAcknowledgementFraming",
          }
          attempt_groups = {
              "TestPGReturnAttemptDueAndPendingCapacity": (
                  "due", "exact_capacity_including_pending", "ready_plus_survivors_fits_but_pending_overflows",
              ),
              "TestPGReturnAttemptReadOnlyStates": ("early", "annihilation"),
              "TestPGReturnAttemptCanceledPin": ("cancel_request_false", "cancel_request_true"),
              "TestPGReturnAttemptPanicLifetime": (
                  "precommit", "commit_start", "commit_end", "distinct_concurrent_unknowns",
              ),
              "TestPGReturnAttemptConfirmedLifetime": ("close", "missing_record"),
              "TestPGReturnAttemptPinAndActorOrder": ("due", "terminal"),
              "TestPGReturnAttemptNetworkUncertainty": (
                  "lost_acknowledgement", "fragmented_lost_acknowledgement", "cut_before_commit",
              ),
              "TestPGReturnAttemptDuplicateWalletWorldSerialization": ("due", "early", "credited", "annihilated"),
              "TestPGRecruitAttemptAdmissionAndReplay": (
                  "same_command", "changed_current_owner", "missing_current_readiness",
              ),
              "TestPGRecruitReturnInteroperability": (
                  "real_pending_exact_capacity", "real_pending_prevents_overflow", "return_credit_prevents_new_recruit",
              ),
          }
          # These are in-process tests: real wire loss and tracer panic remain distinct.
          # Their named PASS outcomes include fixture cleanup; no child events or logs are invented.
          attempts.update(f"{parent}/{child}" for parent, children in attempt_groups.items() for child in children)
          if len(attempts) != 55 or attempts & {name for _, name in required}:
              raise SystemExit("Frozen actual-attempt inventory changed")
          required.update((root, name) for name in attempts)
          if len(required) != (176 if phase == "preflight" else 401):
              raise SystemExit("Combined actual-attempt inventory changed")
          # Approved composition e9542480 adds #2187 failures, #2190 serialization,
          # and #2191 real wire uncertainty. Later lifetime/recovery work is excluded.
          companions = {
              "TestPGRecruitAttemptBusinessFailures",
              "TestPGRecruitAttemptWriteSQLFailure",
              "TestPGRecruitAttemptDeferredCommitFailure",
              "TestPGRecruitAttemptConcurrentCommandReplay",
              "TestPGRecruitAttemptNetworkUncertainty",
          }
          companion_groups = {
              "TestPGRecruitAttemptBusinessFailures": ("unsupported_version", "insufficient_funds"),
              "TestPGRecruitAttemptConcurrentCommandReplay": ("same_intent", "conflicting_count"),
              "TestPGRecruitAttemptNetworkUncertainty": (
                  "normal_reply", "lost_acknowledgement", "fragmented_lost_acknowledgement", "cut_before_commit",
              ),
          }
          companions.update(f"{parent}/{child}" for parent, children in companion_groups.items() for child in children)
          if len(companions) != 13 or companions & {name for _, name in required}:
              raise SystemExit("Frozen Recruit companion inventory changed")
          required.update((root, name) for name in companions)
          if len(required) != (189 if phase == "preflight" else 414):
              raise SystemExit("Combined military-attempt inventory changed")
          # Final pre-runtime composition ac5c96eb adds only #2193 confirmed lifetime.
          confirmed_lifetime = {
              "TestPGRecruitAttemptConfirmedLifetime",
              "TestPGRecruitAttemptConfirmedLifetime/close",
              "TestPGRecruitAttemptConfirmedLifetime/missing_record",
          }
          if len(confirmed_lifetime) != 3 or confirmed_lifetime & {name for _, name in required}:
              raise SystemExit("Frozen confirmed-lifetime inventory changed")
          required.update((root, name) for name in confirmed_lifetime)
          if len(required) != (192 if phase == "preflight" else 417):
              raise SystemExit("Final military-attempt inventory changed")
          tested_packages = {package for package, _ in required}
          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          observed = {event.get("Package") for event in events}
          passed = {
              (event.get("Package"), event["Test"]) for event in events
              if event["Action"] == "pass" and event.get("Test")
          }
          bad = [
              event for event in events
              if event["Action"] == "fail" or event["Action"] == "skip"
              and (event.get("Test") or event.get("Package") not in no_tests)
              or event.get("Package") in no_tests and "Test" in event
          ]
          for package in tested_packages | no_tests:
              terminal = [
                  event["Action"] for event in events
                  if event.get("Package") == package and not event.get("Test")
                  and event["Action"] in {"pass", "skip", "fail"}
              ]
              wanted = ["skip"] if package in no_tests else ["pass"]
              if terminal != wanted:
                  bad.append({"package": package, "terminal": terminal})
              if package in no_tests and not any(
                  event.get("Package") == package and "Test" not in event
                  and event["Action"] == "output"
                  and event.get("Output") == f"?   \t{package}\t[no test files]\n"
                  for event in events
              ):
                  bad.append({"package": package, "missing_no_test_files_output": True})
          started = {
              (event.get("Package"), event["Test"]) for event in events
              if event["Action"] == "run" and event.get("Test")
          }
          unfinished = sorted(started - passed)
          missing = sorted(required - passed)
          if bad or missing or unfinished or observed != tested_packages | no_tests:
              raise SystemExit(f"API PG gate failed: bad={bad}, missing={missing}, unfinished={unfinished}, observed={observed}")
          # The isolated child has no root Go test events. Require the parent's final
          # confirmation after its structured witness and independent cleanup checks.
          cleanup_confirmation = "verified primary/live/unknown/retained slot, actual pool closing and isolated teardown; not graceful drain"
          cleanup_outputs = [
              event for event in events
              if event.get("Package") == root and event.get("Test") == "TestPGRecruitGenerationConstructorCleanupPanic"
              and event["Action"] == "output" and event.get("Output", "").rstrip().endswith(": " + cleanup_confirmation)
          ]
          if len(cleanup_outputs) != 1:
              raise SystemExit("Missing or duplicate parent confirmation of isolated cleanup-panic evidence")
          top_level = sum("/" not in name for _, name in passed)
          print(f"{sys.argv[2]}/{phase}: {top_level} top-level / {len(passed)} including subtests PASS")
          print(f"Verified {len(required)} required tests/scenarios and all {len(tested_packages)} tested-package PASS events")
          print(f"Zero skipped tests or failures; {len(no_tests)} packages have no test files (Go package-only skip)")
          print("Optional t.Log branches are not full gameplay coverage; their actual output is preserved above")
          print("\n".join(f"{package}: {name}" for package, name in sorted(required)))
          PY
      - name: Run full API regressions without short mode
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [[ "$MODE" == race ]]; then flags=(-race); fi
          gate="$RUNNER_TEMP/api-gate.py"
          # Preflight and full acceptance own different disposable databases.
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_preflight_$MODE"
          log="$RUNNER_TEMP/api-preflight-$MODE.json"
          DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/api_preflight_$MODE?sslmode=disable" \
          go test ./internal/api "${flags[@]}" -run '^(TestReturnSource|TestPGReturnGeneration|TestRecruitSource|TestPGRecruitGeneration|TestPGRecruitBundleCopiedAccessLifetime|TestPGRecruitBundleRejectsAccessSubstitution|TestRecruitGenerationSQLAllowlist|TestReturnSQLRecorded|TestRecruitPanicAbsenceRejectsInvalidIdentity|TestReturnAttempt|TestPGReturnAttempt|TestRecruitAttempt|TestPGRecruitAttempt|TestPGRecruitReturn|TestReturnNetworkAcknowledgementFraming|TestReturnBackendOwnershipFailClosed|TestPGReturnBackendCleanupOwnership)' -count=1 -timeout=5m -json | tee "$log"
          python3 "$gate" "$log" "$MODE" preflight
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_$MODE"
          log="$RUNNER_TEMP/api-$MODE.json"
          DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/api_$MODE?sslmode=disable" \
          go test ./internal/api/... "${flags[@]}" -count=1 -timeout=120m -json | tee "$log"
          python3 "$gate" "$log" "$MODE" full
