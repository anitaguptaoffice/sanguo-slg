name: API return PostgreSQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-pg-test:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [ordinary, race]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Verify PostgreSQL 17 and host toolchain
        shell: bash
        run: |
          go version
          command -v psql
          psql --version
          version=$(docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -Atc "SHOW server_version_num")
          [[ "$version" =~ ^[0-9]+$ ]]
          (( version / 10000 == 17 ))
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -c "SELECT version()"
      - name: Check API return source formatting
        shell: bash
        run: |
          files=$(gofmt -l internal/api/return_source.go \
            internal/api/return_source_fixture_test.go \
            internal/api/return_source_lifetime_pg_test.go \
            internal/api/return_source_pg_test.go \
            internal/api/return_source_pins_pg_test.go \
            internal/api/return_source_test.go \
            internal/api/intg006_smoke_test.go \
            internal/api/authenticated_entry_pg_test.go \
            internal/api/smoke_daily_clock_export_test.go \
            internal/api/smoke_daily_clock_pg_test.go)
          if [[ -n "$files" ]]; then
            printf 'Unformatted API source:\n%s\n' "$files"
            while IFS= read -r file; do
              gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Verify parallel runner controls
        run: python3 -m unittest discover -s .github/scripts -p test_api_pg_parallel.py -v
      - name: Run full API regressions without short mode
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          RECRUIT_BINDINGS_STATE="$(python3 .github/scripts/check_recruit_v2_bindings_json.py --state)"
          export RECRUIT_BINDINGS_STATE
          test "$RECRUIT_BINDINGS_STATE" = legacy || test "$RECRUIT_BINDINGS_STATE" = v2
          flags=()
          if [[ "$MODE" == race ]]; then flags=(-race); fi
          gate="$RUNNER_TEMP/api-gate.py"
          cat > "$gate" <<'PY'
          import json
          import os
          import sys

          phase = sys.argv[3]
          if phase not in {"preflight", "full"}:
              raise SystemExit("Unknown API test phase")
