          required = {(root, name) for name in expected}
          required.add((root + "/pb/sanguo/domestic/v1", "TestGarrisonWireCompatibility"))
          required.add((root + "/pb/sanguo/quest/v1", "TestClaimRewardWireCompatibility"))
          adopted = os.environ["RECRUIT_BINDINGS_STATE"] == "v2"
          required.update((root + "/pb/sanguo/military/v1", name) for name in ({
              "TestRecruitV2Descriptors",
              "TestRecruitV2Descriptors/RecruitTroopV2Request",
              "TestRecruitV2Descriptors/RecruitTroopV2Response",
              "TestRecruitV2Descriptors/RecruitAcceptance",
              "TestRecruitV2ExactIntegerBoundaries",
              "TestRecruitV2WireAndPresence",
              "TestRecruitV2UnknownFieldsAndOpaqueBytes",
          } if adopted else set()))
          no_tests = {
              root + f"/pb/sanguo/{domain}/v1"
              for domain in ("content", "hero", "rank", "shop", "world")
          }
          if not adopted:
              no_tests.add(root + "/pb/sanguo/military/v1")
          if phase == "preflight":
              required = {item for item in required if item[1].startswith(("TestReturnSource", "TestPGReturnGeneration"))
                          or item[1].split("/", 1)[0] in {"TestSmokeDailyCalendarClockPG", "TestAuthenticatedEntryWirePG"}}
              no_tests = set()
          if len(required) != (47 if phase == "preflight" else 279 if adopted else 272):
              raise SystemExit("Frozen API inventory changed")
          tested_packages = {package for package, _ in required}
          with open(sys.argv[1], encoding="utf-8") as stream:
              events = [json.loads(line) for line in stream if line.strip()]
          observed = {event.get("Package") for event in events}
          passed = {
              (event.get("Package"), event["Test"]) for event in events
              if event["Action"] == "pass" and event.get("Test")
          }
          bad = [
              event for event in events
              if event["Action"] == "fail" or event["Action"] == "skip"
              and (event.get("Test") or event.get("Package") not in no_tests)
              or event.get("Package") in no_tests and "Test" in event
          ]
          for package in tested_packages | no_tests:
              terminal = [
                  event["Action"] for event in events
                  if event.get("Package") == package and not event.get("Test")
                  and event["Action"] in {"pass", "skip", "fail"}
              ]
              wanted = ["skip"] if package in no_tests else ["pass"]
              if phase == "full" and package == root:
                  wanted = ["pass"] * 4  # Four independently audited, disjoint root shards.
              if terminal != wanted:
                  bad.append({"package": package, "terminal": terminal})
              if package in no_tests and not any(
                  event.get("Package") == package and "Test" not in event
                  and event["Action"] == "output"
                  and event.get("Output") == f"?   \t{package}\t[no test files]\n"
                  for event in events
              ):
                  bad.append({"package": package, "missing_no_test_files_output": True})
          started = {
              (event.get("Package"), event["Test"]) for event in events
              if event["Action"] == "run" and event.get("Test")
          }
          unfinished = sorted(started - passed)
          missing = sorted(required - passed)
          if bad or missing or unfinished or observed != tested_packages | no_tests:
              raise SystemExit(f"API PG gate failed: bad={bad}, missing={missing}, unfinished={unfinished}, observed={observed}")
          top_level = sum("/" not in name for _, name in passed)
          print(f"{sys.argv[2]}/{phase}: {top_level} top-level / {len(passed)} including subtests PASS")
          print(f"Verified {len(required)} required tests/scenarios and all {len(tested_packages)} tested-package PASS events")
          print(f"Zero skipped tests or failures; {len(no_tests)} packages have no test files (Go package-only skip)")
          print("Optional t.Log branches are not full gameplay coverage; their actual output is preserved above")
          print("\n".join(f"{package}: {name}" for package, name in sorted(required)))
          PY
          # Preflight and full acceptance own different disposable databases.
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_preflight_$MODE"
          log="$RUNNER_TEMP/api-preflight-$MODE.json"
          DATABASE_URL="postgres://sanguo:sanguo@localhost:5432/api_preflight_$MODE?sslmode=disable" \
          go test ./internal/api "${flags[@]}" -run '^(TestReturnSource|TestPGReturnGeneration|TestSmokeDailyCalendarClockPG$|TestAuthenticatedEntryWirePG$)' -count=1 -timeout=5m -json | tee "$log"
          python3 "$gate" "$log" "$MODE" preflight
          # DB names alone do not isolate pg_locks / pg_stat_activity witnesses.
          # Reuse the verified PG17 image, but give each root shard its own cluster.
          image=$(docker inspect "${{ job.services.postgres.id }}" --format '{{.Image}}')
          for shard in 0 1 2 3; do
            docker run --detach --name "api-$MODE-$shard" \
              -p "127.0.0.1:$((15432 + shard)):5432" \
              -e POSTGRES_USER=sanguo -e POSTGRES_PASSWORD=sanguo \
              -e POSTGRES_DB="api_${MODE}_$shard" "$image"
          done
          for shard in 0 1 2 3; do
            ready=false
            for attempt in {1..30}; do
              if docker exec "api-$MODE-$shard" pg_isready -h 127.0.0.1 -U sanguo -d "api_${MODE}_$shard"; then
                ready=true; break
              fi
              sleep 1
            done
            "$ready"
            version=$(docker exec "api-$MODE-$shard" psql -X -h 127.0.0.1 -U sanguo -d "api_${MODE}_$shard" -Atc "SHOW server_version_num")
            [[ "$version" =~ ^[0-9]+$ ]] && (( version / 10000 == 17 ))
          done
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE api_${MODE}_4"
          evidence="$RUNNER_TEMP/api-parallel-$MODE"
          python3 .github/scripts/api_pg_parallel.py "$MODE" "$evidence"
          python3 "$gate" "$evidence/full.json" "$MODE" full
      - name: Preserve diagnostics and remove owned shard clusters
        if: always()
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          diagnostics="$RUNNER_TEMP/api-clusters-$MODE"
          mkdir -p "$diagnostics"
          status=0
          for shard in 0 1 2 3; do
            name="api-$MODE-$shard"
            if docker container inspect "$name" > /dev/null 2>&1; then
              docker logs "$name" > "$diagnostics/$shard.log" 2>&1 || status=1
              docker rm --force "$name" || status=1
            fi
          done
          exit "$status"
      - name: Preserve parallel evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-parallel-${{ matrix.mode }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/api-parallel-${{ matrix.mode }}
            ${{ runner.temp }}/api-clusters-${{ matrix.mode }}
          if-no-files-found: error
