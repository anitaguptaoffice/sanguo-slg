name: API return PostgreSQL

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-pg-test:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [ordinary, race]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sanguo
          POSTGRES_PASSWORD: sanguo
          POSTGRES_DB: sanguo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanguo -d sanguo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.12"
          cache: true
      - name: Verify PostgreSQL 17 and host toolchain
        shell: bash
        run: |
          go version
          [[ "$(go env GOVERSION)" == go1.23.12 ]]
          git rev-parse HEAD HEAD^{tree}
          command -v psql
          psql --version
          version=$(docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -Atc "SHOW server_version_num")
          [[ "$version" =~ ^[0-9]+$ ]]
          (( version / 10000 == 17 ))
          docker exec "${{ job.services.postgres.id }}" psql -X -U sanguo -d sanguo -c "SELECT version()"
      - name: Check API source and SQL evidence formatting
        shell: bash
        run: |
          files=$(gofmt -l internal/api/return_source.go \
            internal/api/return_source_fixture_test.go \
            internal/api/return_source_lifetime_pg_test.go \
            internal/api/return_source_pg_test.go \
            internal/api/return_source_pins_pg_test.go \
            internal/api/return_source_test.go \
