services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sanguo
      POSTGRES_PASSWORD: sanguo
      POSTGRES_DB: sanguo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanguo -d sanguo"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
