<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国 SLG · H5 骨架</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #1a1410; color: #f5e6c8; }
      #game-viewport {
        position: fixed; inset: 0; background: #1a1410; overflow: hidden;
      }
      #layout-frame { position: absolute; left: 0; top: 0; }
      #game {
        display: block; width: 100%; height: 100%;
        background: #1a1410; touch-action: none;
      }
      #hud {
        position: absolute; left: 0; top: 0; width: 100%; height: calc(56 / 900 * 100%);
        padding: 0 12px; display: flex; align-items: center;
        font-size: clamp(11px, 1.4vw, 15px); color: #c9b896;
        pointer-events: none; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        z-index: 2;
      }
      .layout-toolbar {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: calc(56 / 900 * 100%); z-index: 3;
      }
      .layout-overlay-center {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(640px, 92%); overflow: auto; z-index: 4;
      }
      .main-city-toolbar { padding: 0 8px; display: flex; gap: 6px; align-items: center; }
      .main-city-toolbar button {
        flex: 1; min-height: 0; padding: 4px 6px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; font-size: clamp(10px, 1.2vw, 13px); cursor: pointer;
      }
      .main-city-toolbar button:active { background: #4a3a30; }
      .military-panel {
        position: absolute; right: 0; top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(420px, 42%); margin: 0; padding: 12px 16px; font-size: 13px;
        background: transparent; border-radius: 0; overflow: auto; z-index: 5;
      }
      .military-panel.hidden { display: none; }
      .military-panel h3 { margin-bottom: 8px; font-size: 15px; }
      .military-panel label { display: block; margin: 6px 0; }
      .military-panel input, .military-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .military-panel button {
        margin-top: 8px; padding: 8px 12px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; cursor: pointer;
      }
      .military-panel hr { border: none; border-top: 1px solid #5c4a32; margin: 12px 0; }
      .report-list { list-style: none; margin: 8px 0; padding: 0; }
      .report-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .report-list li:hover { background: #3d3028; }
      .report-detail {
        margin-top: 8px; padding: 8px; background: #1a1410; border-radius: 4px;
        font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow: auto;
      }
      .server-select-panel {
        max-width: 640px; margin: 0; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
      }
      .social-panel {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(640px, 92%); margin: 0; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
        overflow: auto; z-index: 4;
      }
      .server-select-panel h2 { font-size: 16px; margin-bottom: 8px; }
      .server-list { list-style: none; margin: 8px 0; padding: 0; }
      .server-list li {
        padding: 10px; margin-bottom: 6px; background: #1a1410; border-radius: 6px; cursor: pointer;
      }
      .server-list li.selected { outline: 2px solid #c9a227; }
      .server-list li.disabled { opacity: 0.5; pointer-events: none; }
      .server-select-panel button, .social-panel button {
        margin: 6px 6px 0 0; padding: 8px 12px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; cursor: pointer;
      }
      .social-panel.hidden, .content-panel.hidden { display: none; }
      .content-panel {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(640px, 92%); margin: 0; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
        overflow: auto; z-index: 4;
      }
      .content-panel h3 { margin-bottom: 8px; font-size: 15px; }
      .content-panel label { display: block; margin: 6px 0; }
      .content-panel input, .content-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .content-panel button {
        margin: 6px 6px 0 0; padding: 8px 12px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; cursor: pointer;
      }
      .quest-list, .bag-list, .shop-list, .hero-list, .mail-list, .battle-report-list, .daily-quest-list {
        margin: 8px 0; padding-left: 18px; max-height: 160px; overflow: auto;
      }
      .battle-report-list { list-style: none; padding-left: 0; }
      .battle-report-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px;
      }
      .battle-report-list li.selected { outline: 2px solid #c9a227; }
      .battle-report-list li[data-report-id] { cursor: pointer; }
      .battle-report-list li[data-report-id]:hover { background: #3d3028; }
      .report-panel-status { margin: 6px 0; font-size: 12px; color: #e8a87c; min-height: 1em; }
      .content-panel .report-detail {
        margin-top: 8px; padding: 8px; background: #1a1410; border-radius: 4px;
        font-size: 12px; white-space: pre-wrap; max-height: 140px; overflow: auto;
      }
      .daily-quest-list { list-style: none; padding-left: 0; }
      .daily-quest-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .daily-quest-list li.selected { outline: 2px solid #c9a227; }
      .daily-quest-list li:hover { background: #3d3028; }
      .daily-quest-detail {
        margin-top: 8px; padding: 8px; max-height: 80px; overflow: auto;
        background: #1a1410; border-radius: 4px; font-size: 12px; white-space: pre-wrap;
      }
      .hero-detail, .mail-body {
        margin-top: 8px; padding: 8px; max-height: 100px; overflow: auto;
        background: #1a1410; border-radius: 4px; font-size: 12px; white-space: pre-wrap;
      }
      .social-panel label { display: block; margin: 6px 0; }
      .social-panel input, .social-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .chat-log, .guild-members, .rank-list { margin: 8px 0; padding-left: 18px; max-height: 140px; overflow: auto; }
      .chat-log { list-style: none; padding-left: 0; }
      .chat-log li { padding: 4px 0; border-bottom: 1px solid #3d3028; }
      .main-city-toolbar { flex-wrap: wrap; }
      .main-city-toolbar button { min-width: 72px; flex: 1 1 30%; }
    </style>
  </head>
  <body>
    <div id="game-viewport">
      <div id="layout-frame">
        <canvas id="game" width="1600" height="900"></canvas>
        <div id="hud">初始化中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
