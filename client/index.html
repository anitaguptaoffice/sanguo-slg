<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国 SLG · H5 骨架</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #1a1410; color: #f5e6c8; }
      #game { display: block; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 9/16; background: #2d241c; }
      #hud { max-width: 480px; margin: 0 auto; padding: 8px 12px; font-size: 13px; color: #c9b896; }
      .main-city-toolbar { max-width: 480px; margin: 0 auto; padding: 8px 12px; display: flex; gap: 8px; }
      .main-city-toolbar button {
        flex: 1; padding: 10px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; font-size: 14px; cursor: pointer;
      }
      .main-city-toolbar button:active { background: #4a3a30; }
      .military-panel {
        max-width: 480px; margin: 0 auto; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
      }
      .military-panel.hidden { display: none; }
      .military-panel h3 { margin-bottom: 8px; font-size: 15px; }
      .military-panel label { display: block; margin: 6px 0; }
      .military-panel input, .military-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .military-panel button {
        margin-top: 8px; padding: 8px 12px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; cursor: pointer;
      }
      .military-panel hr { border: none; border-top: 1px solid #5c4a32; margin: 12px 0; }
      .report-list { list-style: none; margin: 8px 0; padding: 0; }
      .report-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .report-list li:hover { background: #3d3028; }
      .report-detail {
        margin-top: 8px; padding: 8px; background: #1a1410; border-radius: 4px;
        font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="360" height="640"></canvas>
    <div id="hud">初始化中…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
