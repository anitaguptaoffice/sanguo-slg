<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>三国 SLG · H5 骨架</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body { font-family: system-ui, sans-serif; background: #1a1410; color: #f5e6c8; }
      #game-viewport {
        position: fixed; inset: 0; background: #1a1410; overflow: hidden;
      }
      #layout-frame { position: absolute; left: 0; top: 0; }
      #game {
        display: block; width: 100%; height: 100%;
        background: #1a1410; touch-action: none;
      }
      #hud {
        position: absolute; left: 0; top: 0; width: 100%;
        min-height: calc(56 / 900 * 100%); max-height: calc(80 / 900 * 100%);
        padding: 4px 10px; display: flex; flex-wrap: wrap; align-items: center; align-content: center;
        gap: 6px 10px; font-size: clamp(10px, 1.25vw, 14px); color: #c9b896;
        background: rgba(26, 20, 16, 0.92);
        pointer-events: none; overflow: hidden;
        z-index: 2;
      }
      #hud .hud-group {
        flex: 0 1 auto; max-width: 100%; padding-right: 10px;
        border-right: 1px solid rgba(92, 74, 50, 0.65);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #hud .hud-group:last-child {
        border-right: none; padding-right: 0;
      }
      #hud .hud-wallet-gain {
        color: #9fd89f; font-weight: 600; flex-shrink: 0;
      }
      #hud .hud-march-report-toast {
        pointer-events: auto; cursor: pointer;
        color: #e8c547; font-weight: 600; flex-shrink: 0;
        text-decoration: underline; text-underline-offset: 2px;
      }
      #hud .hud-resource-strip {
        display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
      }
      #hud .hud-resource-amount { font-variant-numeric: tabular-nums; }
      #hud .hud-resource-item {
        display: inline-flex; align-items: center; gap: 3px;
      }
      #hud .hud-resource-icon {
        display: block; width: 18px; height: 18px; object-fit: contain;
      }
      .layout-toolbar {
        position: absolute; left: 0; right: 0; bottom: 0;
        height: calc(56 / 900 * 100%); z-index: 3;
      }
      .layout-overlay-center {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(640px, 92%); overflow: auto; z-index: 4;
      }
      .main-city-toolbar { padding: 0 8px; display: flex; gap: 6px; align-items: center; }
      .main-city-toolbar button {
        position: relative;
        flex: 1; min-height: 0; padding: 4px 6px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; font-size: clamp(10px, 1.2vw, 13px); cursor: pointer;
      }
      .main-city-toolbar button:active { background: #4a3a30; }
      .main-city-toolbar .toolbar-badge {
        position: absolute; top: 1px; right: 1px;
        min-width: 15px; height: 15px; padding: 0 3px;
        border-radius: 8px; background: #c45c3a; color: #fff;
        font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
        pointer-events: none; z-index: 1;
      }
      .main-city-toolbar .toolbar-badge.hidden { display: none; }
      .main-city-toolbar .toolbar-badge.toolbar-badge--deeplink {
        pointer-events: auto;
        cursor: pointer;
      }
      .military-panel {
        position: absolute; right: 0; top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(420px, 42%); margin: 0; padding: 12px 16px; font-size: 13px;
        background: transparent; border-radius: 0; overflow: auto; z-index: 5;
        color: #3d2e1f;
      }
      .military-panel.hidden { display: none; }
      .military-panel h3 { margin-bottom: 8px; font-size: 15px; color: #2a1f14; font-weight: 700; }
      .military-panel label { display: block; margin: 6px 0; color: #3d2e1f; }
      .military-panel .military-troops,
      .military-panel .military-march { color: #4a3828; line-height: 1.45; }
      .military-panel input, .military-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .military-panel button.art-btn-primary {
        margin-top: 8px; cursor: pointer;
      }
      .military-panel hr { border: none; border-top: 1px solid rgba(61, 46, 31, 0.35); margin: 12px 0; }
      .report-list { list-style: none; margin: 8px 0; padding: 0; }
      .report-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .report-list li:hover { background: #3d3028; }
      .report-detail {
        margin-top: 8px; padding: 8px; background: #1a1410; border-radius: 4px;
        font-size: 12px; white-space: pre-wrap; max-height: 160px; overflow: auto;
      }
      .server-select-panel {
        max-width: 640px; margin: 0; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
      }
      .social-panel {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(640px, 92%); margin: 0; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
        overflow: auto; z-index: 4;
      }
      .server-select-panel h2 { font-size: 16px; margin-bottom: 8px; }
      .server-list { list-style: none; margin: 8px 0; padding: 0; }
      .server-list li {
        padding: 10px; margin-bottom: 6px; background: #1a1410; border-radius: 6px; cursor: pointer;
      }
      .server-list li.selected { outline: 2px solid #c9a227; }
      .server-list li.disabled { opacity: 0.5; pointer-events: none; }
      .server-select-panel button, .social-panel button {
        margin: 6px 6px 0 0; padding: 8px 12px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; cursor: pointer;
      }
      .social-panel.hidden, .content-panel.hidden { display: none; }
      .content-panel {
        position: absolute; left: 50%; transform: translateX(-50%);
        top: calc(56 / 900 * 100%); bottom: calc(56 / 900 * 100%);
        width: min(640px, 92%); margin: 0; padding: 12px; font-size: 13px;
        background: #2a221c; border: 1px solid #5c4a32; border-radius: 8px;
        overflow: auto; z-index: 4;
      }
      .content-panel h3 { margin-bottom: 8px; font-size: 15px; }
      .content-panel .panel-feedback {
        margin: 8px 0; padding: 8px; background: #1a1410; border-radius: 4px;
        border-left: 3px solid #c9a227; color: #f0c674; font-size: 12px; line-height: 1.4;
      }
      .content-panel label { display: block; margin: 6px 0; }
      .content-panel input, .content-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .content-panel button {
        margin: 6px 6px 0 0; padding: 8px 12px; border: 1px solid #5c4a32; border-radius: 6px;
        background: #3d3028; color: #f5e6c8; cursor: pointer;
      }
      .quest-list, .bag-list, .shop-list, .hero-list, .mail-list, .template-list, .battle-report-list, .march-list, .daily-quest-list, .world-city-list {
        margin: 8px 0; padding-left: 18px; max-height: 160px; overflow: auto;
      }
      .battle-report-list, .march-list { list-style: none; padding-left: 0; }
      .battle-report-list li, .march-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px;
      }
      .battle-report-list li.battle-report-empty,
      .battle-report-list li.battle-report-filter-empty {
        cursor: default; color: #b8a88a;
      }
      .battle-report-list li.battle-report-empty.is-error { color: #e8a87c; }
      .battle-report-list li[data-report-id] {
        display: flex; gap: 8px; align-items: flex-start; cursor: pointer;
      }
      .battle-outcome-chip {
        flex: 0 0 auto; min-width: 2.5em; padding: 2px 6px; border-radius: 4px;
        font-size: 11px; font-weight: 600; text-align: center; line-height: 1.3;
      }
      .battle-outcome-chip.outcome-attacker-win { background: #3d4a28; color: #b8d4a0; }
      .battle-outcome-chip.outcome-defender-win { background: #4a3028; color: #e8a87c; }
      .battle-outcome-chip.outcome-draw { background: #3a3a30; color: #c9b896; }
      .battle-outcome-chip.outcome-unknown { background: #2a221c; color: #b8a88a; }
      .battle-report-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .battle-report-row-foe { font-size: 12px; line-height: 1.35; }
      .battle-report-row-time { font-size: 11px; color: #b8a88a; }
      .battle-report-list li.selected { outline: 2px solid #c9a227; }
      .battle-report-list li[data-report-id] { cursor: pointer; }
      .battle-report-list li[data-report-id]:hover { background: #3d3028; }
      .march-list li[data-march-id] { cursor: pointer; }
      .march-list li[data-march-id]:hover { background: #3d3028; }
      .march-list li.march-list-row-selected { outline: 2px solid #c9a227; }
      .battle-report-filters { margin: 8px 0; font-size: 12px; }
      .battle-report-filters button.active { outline: 2px solid #c9a227; }
      .report-rounds-table-wrap { margin-top: 8px; font-size: 12px; }
      .battle-report-rounds-table {
        width: 100%; border-collapse: collapse; font-size: 11px;
      }
      .battle-report-rounds-table th,
      .battle-report-rounds-table td {
        border: 1px solid #3d3028; padding: 4px 6px; text-align: left; vertical-align: top;
      }
      .battle-report-rounds-table th { background: #2a221c; color: #e8dcc8; font-weight: 600; }
      .report-rounds-collapsed-hint { margin: 6px 0 4px; color: #b8a88a; font-size: 11px; }
      .report-panel-status { margin: 6px 0; font-size: 12px; color: #e8a87c; min-height: 1em; }
      .content-panel .report-detail {
        margin-top: 8px; padding: 8px; background: #1a1410; border-radius: 4px;
        font-size: 12px; max-height: min(360px, 48vh); overflow: auto;
      }
      .content-panel .report-detail pre {
        margin: 0 0 8px; white-space: pre-wrap;
      }
      .queue-list {
        margin: 8px 0; padding-left: 0; list-style: none;
        max-height: min(360px, 42vh); overflow: auto;
      }
      .queue-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px;
        font-size: 12px; line-height: 1.35;
      }
      .queue-panel-hint { font-size: 12px; color: #c9b896; margin-bottom: 6px; }
      .queue-panel-status { margin-top: 8px; font-size: 12px; color: #e8a87c; min-height: 1em; }
      .queue-military-section { margin-top: 10px; }
      .queue-military-section.hidden { display: none; }
      .queue-military-heading { font-size: 13px; margin: 0 0 6px; color: #e8dcc8; }
      .daily-quest-list { list-style: none; padding-left: 0; }
      .daily-quest-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .daily-quest-list li.selected { outline: 2px solid #c9a227; }
      .daily-quest-list li:hover { background: #3d3028; }
      .world-city-list { list-style: none; padding-left: 0; }
      .world-city-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .world-city-list li[data-city-id]:hover { background: #3d3028; }
      .world-city-list li.current-main { outline: 1px solid #8b7355; }
      .world-panel-hint { font-size: 12px; color: #c4b59a; margin-bottom: 6px; }
      .daily-quest-next {
        margin: 8px 0; padding: 8px; background: #1a1410; border-radius: 4px;
        border-left: 3px solid #6a9fd8; font-size: 12px; line-height: 1.45;
      }
      .bag-list { list-style: none; padding-left: 0; }
      .bag-list li.bag-stack-row {
        display: grid; grid-template-columns: 3.5em 1fr 3.5em; gap: 8px; align-items: baseline;
        padding: 6px 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px;
        font-family: ui-monospace, monospace; font-size: 12px;
      }
      .bag-stack-id { font-variant-numeric: tabular-nums; color: #c9b896; }
      .bag-stack-name { font-family: inherit; }
      .bag-stack-qty { text-align: right; font-variant-numeric: tabular-nums; }
      .bag-list li.bag-empty { cursor: default; color: #b8a88a; font-family: inherit; font-size: 12px; line-height: 1.4; }
      .bag-list li.item-highlight { outline: 2px solid #c9a227; background: #3d3028; }
      .bag-panel-feedback { margin-top: 8px; }
      .daily-quest-detail {
        margin-top: 8px; padding: 8px; max-height: 80px; overflow: auto;
        background: #1a1410; border-radius: 4px; font-size: 12px; white-space: pre-wrap;
      }
      .hero-detail, .mail-body {
        margin-top: 8px; padding: 8px; max-height: 160px; overflow: auto;
        background: #1a1410; border-radius: 4px; font-size: 12px;
      }
      .hero-detail-empty { color: #b8a88a; margin: 0; }
      .hero-detail-head {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin-bottom: 8px;
      }
      .hero-detail-name { font-size: 14px; font-weight: 600; color: #f5e6c8; }
      .hero-detail-level { font-size: 13px; color: #c9a227; }
      .hero-detail-meta { font-size: 11px; color: #b8a88a; flex: 1 1 100%; }
      .hero-attr-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .hero-attr-table th { text-align: left; font-weight: 500; color: #c9b896; padding: 2px 6px 2px 0; width: 3em; }
      .hero-attr-val { width: 2.5em; text-align: right; padding: 2px 4px; color: #f5e6c8; }
      .hero-attr-bar { padding: 2px 0; }
      .hero-attr-bar span.hero-attr-bar-fill {
        display: block; height: 6px; border-radius: 3px;
        background: linear-gradient(90deg, #6a9fd8, #4a7fb8); min-width: 2px;
      }
      .hero-detail-hint { margin: 8px 0 0; font-size: 11px; color: #b8a88a; line-height: 1.4; }
      .template-list li.recruit-owned { color: #a8c4a0; }
      .template-list li.selected { outline: 2px solid #c9a227; }
      .recruit-cost-preview { font-size: 12px; color: #e8dcc8; min-height: 1.2em; }
      .mail-body { white-space: pre-wrap; }
      .mail-inbox-panel .mail-inbox-toolbar {
        display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px;
      }
      .mail-inbox-panel .mail-filter-btn.selected { outline: 2px solid #c9a227; }
      .mail-inbox-status { margin: 4px 0; font-size: 12px; color: #b8a88a; min-height: 1em; }
      .mail-inbox-status.is-error { color: #e8a87c; }
      .mail-list { list-style: none; padding-left: 0; max-height: min(200px, 28vh); }
      .mail-list li {
        padding: 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; cursor: pointer;
      }
      .mail-list li.unread { background: #322a22; border-left: 3px solid #c9a227; }
      .mail-row-summary.mail-row-meta-attach { color: #f0c674; }
      .mail-unclaimed-badge {
        display: inline-block;
        margin-left: 6px;
        padding: 0 5px;
        font-size: 10px;
        line-height: 1.4;
        color: #1a1510;
        background: #f0c674;
        border-radius: 3px;
        vertical-align: middle;
        font-weight: 600;
      }
      .mail-list li.mail-has-unclaimed .mail-row-summary { color: #f0c674; }
      .mail-detail [data-action="claim-mail"].mail-claim-highlight {
        outline: 2px solid #f0c674;
        box-shadow: 0 0 6px rgba(240, 198, 116, 0.45);
      }
      .mail-list li.mail-empty { cursor: default; color: #b8a88a; }
      .mail-list li.selected { outline: 2px solid #c9a227; }
      .mail-list li.unread .mail-row-title { font-weight: 600; }
      .mail-list li.unread .mail-row-title::before { content: "● "; color: #c9a227; }
      .mail-row-title { display: block; font-size: 13px; }
      .mail-row-summary { display: block; font-size: 11px; color: #b8a88a; margin-top: 2px; }
      .mail-detail-title { font-size: 14px; margin: 8px 0 4px; }
      .mail-inbox-hint { font-size: 12px; color: #b8a88a; margin-bottom: 6px; }
      .social-panel label { display: block; margin: 6px 0; }
      .social-panel input, .social-panel select {
        margin-left: 6px; padding: 4px 6px; background: #1a1410; color: #f5e6c8; border: 1px solid #5c4a32;
      }
      .chat-log, .guild-members { margin: 8px 0; padding-left: 0; max-height: 160px; overflow: auto; list-style: none; }
      .chat-log li.chat-day-header {
        position: sticky; top: 0; z-index: 1;
        padding: 6px 4px 4px; margin: 4px 0 2px;
        font-size: 11px; font-weight: 600; color: #c9b896;
        background: #2a221c; border-bottom: 1px solid #5c4a32;
      }
      .chat-log li.chat-msg { padding: 4px 0; border-bottom: 1px solid #3d3028; line-height: 1.45; }
      .chat-log li.chat-msg-world {
        padding: 2px 0; font-size: 12px; line-height: 1.35;
      }
      .chat-log .chat-sender { white-space: normal; word-break: break-word; }
      .rank-board { margin-top: 8px; }
      .rank-viewer-bar {
        position: sticky; top: 0; z-index: 2;
        padding: 8px 10px; margin-bottom: 6px;
        background: #1a1410; border: 1px solid #5c4a32; border-radius: 6px;
        font-size: 12px; line-height: 1.4; color: #f0c674;
      }
      .rank-snapshot-meta { font-size: 11px; color: #b8a88a; margin: 0 0 6px; }
      .rank-table-scroll { max-height: min(200px, 32vh); overflow: auto; border-radius: 4px; }
      .rank-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .rank-table-head th {
        position: sticky; top: 0; z-index: 1;
        padding: 6px 8px; text-align: left; font-weight: 600;
        background: #3d3028; color: #f5e6c8; border-bottom: 1px solid #5c4a32;
      }
      .rank-table td { padding: 6px 8px; border-bottom: 1px solid #3d3028; }
      .rank-table tr.rank-empty-row td { color: #b8a88a; font-size: 11px; line-height: 1.45; }
      .rank-col-rank { width: 3em; color: #c9a227; }
      .rank-col-score { text-align: right; white-space: nowrap; }
      .guild-members { padding-left: 0; max-height: 140px; overflow: auto; list-style: none; }
      .guild-members li { padding: 6px 8px; margin-bottom: 4px; background: #1a1410; border-radius: 4px; font-size: 12px; }
      .main-city-toolbar { flex-wrap: wrap; }
      .main-city-toolbar button { min-width: 72px; flex: 1 1 30%; }
    </style>
  </head>
  <body>
    <div id="game-viewport">
      <div id="layout-frame">
        <canvas id="game" width="1600" height="900"></canvas>
        <div id="hud">初始化中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
