syntax = "proto3";

package sanguo.hero.v1;

import "sanguo/common/v1/types.proto";

option go_package = "github.com/anitaguptaoffice/sanguo-slg/client/pb/sanguo/hero/v1;herov1";

message PlayerHeroSummary {
  int64 hero_id = 1;
  int32 template_cfg_id = 2;
  int32 level = 3;
  int32 loyalty = 4;
  // 将领状态：1=空闲 2=驻守 3=出征 5=城主（与 internal/hero/types.go 对齐；未下发时客户端按未知处理）。
  int32 status = 5;
}

message ListPlayerHeroesRequest {
  int32 server_id = 1;
  int32 page_size = 2;
  int32 page_offset = 3;
}

message ListPlayerHeroesResponse {
  repeated PlayerHeroSummary heroes = 1;
  int32 total_count = 2;
}

message GetHeroDetailRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message HeroAttributes {
  int32 force = 1;
  int32 intel = 2;
  int32 politics = 3;
  int32 command = 4;
}

message GetHeroDetailResponse {
  int64 hero_id = 1;
  int32 template_cfg_id = 2;
  string template_name = 3;
  string template_code = 4;
  int32 rarity = 5;
  int32 level = 6;
  int32 loyalty = 7;
  int32 loyalty_min = 8;
  int32 loyalty_max = 9;
  HeroAttributes attributes = 10;
  int64 exp = 11;
  int64 exp_toward_next = 12;
  int64 upgrade_exp_required = 13;
}

// route: hero.v1.UpgradeHero
message UpgradeHeroRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message UpgradeHeroResponse {
  int64 hero_id = 1;
  int32 level = 2;
  int64 exp = 3;
  int32 previous_level = 4;
  int64 exp_toward_next = 5;
  int64 upgrade_exp_required = 6;
  HeroAttributes attributes = 7;
}

// route: hero.v1.AddHeroPoint
message AddHeroPointRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
  int32 force = 3;
  int32 intel = 4;
  int32 politics = 5;
}

message AddHeroPointResponse {
  int64 hero_id = 1;
  int32 potential_remaining = 2;
  HeroAttributes attributes = 3;
  int32 force_add = 4;
  int32 intel_add = 5;
  int32 politics_add = 6;
}

// route: hero.v1.ClearHeroPoint
message ClearHeroPointRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message ClearHeroPointResponse {
  int64 hero_id = 1;
  int32 potential_remaining = 2;
  HeroAttributes attributes = 3;
  int32 force_add = 4;
  int32 intel_add = 5;
  int32 politics_add = 6;
}

message RecruitHeroRequest {
  int32 server_id = 1;
  int32 template_cfg_id = 2;
  int32 item_cfg_id = 3;
  string pool = 4;
}

message RecruitHeroResponse {
  int64 hero_id = 1;
  int32 template_cfg_id = 2;
  int32 level = 3;
  int32 loyalty = 4;
}

// route: hero.v1.ListRecruitTemplates
message RecruitTemplatePreview {
  int32 template_cfg_id = 1;
  string template_name = 2;
  string template_code = 3;
  string pool = 4;
  int32 rarity = 5;
  sanguo.common.v1.ResourceWallet recruit_cost = 6;
  sanguo.common.v1.RewardItem recruit_item = 7;
  bool already_owned = 8;
}

message ListRecruitTemplatesRequest {
  int32 server_id = 1;
  string pool = 2;
  int32 page_size = 3;
  int32 page_offset = 4;
}

message ListRecruitTemplatesResponse {
  repeated RecruitTemplatePreview templates = 1;
  int32 total_count = 2;
}

// route: hero.v1.ListHotelRecruitCandidates
message HotelRecruitCandidate {
  int64 candidate_id = 1;
  int64 city_id = 2;
  string display_name = 3;
  int32 sex = 4;
  int32 face_id = 5;
  int32 level = 6;
  HeroAttributes attributes = 7;
  int32 loyalty = 8;
  int64 gold_cost = 9;
}

message ListHotelRecruitCandidatesRequest {
  int32 server_id = 1;
  int64 city_id = 2;
}

message ListHotelRecruitCandidatesResponse {
  repeated HotelRecruitCandidate candidates = 1;
  int32 hotel_level = 2;
  int32 hero_capacity = 3;
  int32 hero_owned = 4;
}

// route: hero.v1.RefreshHotelRecruitPool
message RefreshHotelRecruitPoolRequest {
  int32 server_id = 1;
  int64 city_id = 2;
}

message RefreshHotelRecruitPoolResponse {
  repeated HotelRecruitCandidate candidates = 1;
}

// route: hero.v1.RecruitHotelCandidate
message RecruitHotelCandidateRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 candidate_id = 3;
}

message RecruitHotelCandidateResponse {
  int64 hero_id = 1;
  string display_name = 2;
  int32 level = 3;
  int32 loyalty = 4;
}

// route: hero.v1.SetCityChief
message SetCityChiefRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message SetCityChiefResponse {
  int64 city_id = 1;
  int64 hero_id = 2;
  int32 loyalty = 3;
  double production_bonus = 4;
}

// route: hero.v1.ClearCityChief
message ClearCityChiefRequest {
  int32 server_id = 1;
  int64 city_id = 2;
}

message ClearCityChiefResponse {
  int64 city_id = 1;
}

// route: hero.v1.GetCityChief
message GetCityChiefRequest {
  int32 server_id = 1;
  int64 city_id = 2;
}

message GetCityChiefResponse {
  int64 city_id = 1;
  int64 hero_id = 2;
  int32 loyalty = 3;
  double production_bonus = 4;
}

// route: hero.v1.LargessHero
enum LargessGiftKind {
  LARGESS_GIFT_UNSPECIFIED = 0;
  LARGESS_GIFT_GOLD = 1;
  LARGESS_GIFT_ITEM = 2;
}

message LargessHeroRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
  LargessGiftKind gift_kind = 3;
  int32 item_cfg_id = 4; // required when gift_kind = LARGESS_GIFT_ITEM
}

message LargessHeroResponse {
  int64 hero_id = 1;
  int32 loyalty = 2;
  int32 loyalty_delta = 3;
  int64 gold_spent = 4;
  int32 item_cfg_id = 5;
  int64 next_largess_at_ms = 6;
}

// route: hero.v1.ListCaptiveHeroes
message CaptiveHeroSummary {
  int64 hero_id = 1;
  int64 city_id = 2;
  int32 template_cfg_id = 3;
  string display_name = 4;
  int32 level = 5;
  int32 loyalty = 6;
  HeroAttributes attributes = 7;
}

message ListCaptiveHeroesRequest {
  int32 server_id = 1;
}

message ListCaptiveHeroesResponse {
  repeated CaptiveHeroSummary captives = 1;
}

// route: hero.v1.TrySummonCaptive
message SummonCostItem {
  int32 item_cfg_id = 1;
  int32 quantity = 2;
}

message TrySummonCaptiveRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message TrySummonCaptiveResponse {
  int64 hero_id = 1;
  int64 gold_cost = 2;
  repeated SummonCostItem items = 3;
  string summary = 4;
}

// route: hero.v1.SureSummonCaptive
message SureSummonCaptiveRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message SureSummonCaptiveResponse {
  int64 hero_id = 1;
  string display_name = 2;
  int32 level = 3;
  int32 loyalty = 4;
}

// route: hero.v1.ReleaseCaptive
message ReleaseCaptiveRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message ReleaseCaptiveResponse {
  int64 hero_id = 1;
}

// route: hero.v1.ListComingHeroes
message ComingHeroSummary {
  int64 hero_id = 1;
  int64 city_id = 2;
  int32 template_cfg_id = 3;
  string display_name = 4;
  int32 level = 5;
  int32 loyalty = 6;
  HeroAttributes attributes = 7;
}

message ListComingHeroesRequest {
  int32 server_id = 1;
}

message ListComingHeroesResponse {
  repeated ComingHeroSummary coming = 1;
}

// route: hero.v1.TryAcceptComing
message TryAcceptComingRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message TryAcceptComingResponse {
  int64 hero_id = 1;
  string summary = 2;
}

// route: hero.v1.SureAcceptComing
message SureAcceptComingRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message SureAcceptComingResponse {
  int64 hero_id = 1;
  string display_name = 2;
  int32 level = 3;
  int32 loyalty = 4;
}

// route: hero.v1.RejectComing
message RejectComingRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int64 hero_id = 3;
}

message RejectComingResponse {
  int64 hero_id = 1;
}

// route: hero.v1.ListPersuadeTargets
message PersuadeTargetSummary {
  int32 npc_cfg_id = 1;
  int32 template_cfg_id = 2;
  string display_name = 3;
  int32 level = 4;
  int32 friend = 5;
  int32 state = 6;
  int32 hire_friend_min = 7;
  int64 next_persuade_at_ms = 8;
}

message ListPersuadeTargetsRequest {
  int32 server_id = 1;
}

message ListPersuadeTargetsResponse {
  repeated PersuadeTargetSummary targets = 1;
}

// route: hero.v1.PersuadeHero
message PersuadeHeroRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int32 npc_cfg_id = 3;
}

message PersuadeHeroResponse {
  int32 npc_cfg_id = 1;
  int32 friend = 2;
  int32 friend_delta = 3;
  int64 next_persuade_at_ms = 4;
}

// route: hero.v1.LionizeHero
message LionizeHeroRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int32 npc_cfg_id = 3;
}

message LionizeHeroResponse {
  int32 npc_cfg_id = 1;
  int32 friend = 2;
  int32 state = 3;
  int64 gold_spent = 4;
  bool befriended = 5;
  bool recruited = 6;
  int64 hero_id = 7;
  string display_name = 8;
}

// route: hero.v1.BeginHeroExpr
message BeginHeroExprRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
  int32 hours = 3; // M1: 1–4, default 1 when 0
}

message BeginHeroExprResponse {
  int64 hero_id = 1;
  int32 status = 2;
  int64 ends_at_ms = 3;
  int64 gold_spent = 4;
  int32 hours = 5;
}

// route: hero.v1.CancelHeroExpr
message CancelHeroExprRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message CancelHeroExprResponse {
  int64 hero_id = 1;
  int32 status = 2;
}

// route: hero.v1.FinishHeroExpr
message FinishHeroExprRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message FinishHeroExprResponse {
  int64 hero_id = 1;
  int32 status = 2;
  int64 exp_gained = 3;
  int64 exp = 4;
}

// route: hero.v1.FasterHeroExpr
message FasterHeroExprRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message FasterHeroExprResponse {
  int64 hero_id = 1;
  int32 status = 2;
  int64 exp_gained = 3;
  int64 exp = 4;
}
