# 任务卡清单（唯一真源）
# 改这里 → 跑 tools/tasks_sync.py → GitHub Issues 同步
# 字段说明见 tasks/README.md

- id: SPEC-001
  title: 领域模型与数据库 DDL 草案
  wave: 1
  domain: spec
  depends_on: []
  size: L
  owner_dir: spec/db
  scope: [spec/db/**, spec/rules/**]
  out_of_scope: [internal/**, cmd/**]
  acceptance:
    - 6 个域（account/world/domestic/military/hero/content）各一份 DDL
    - 每张表带注释，说明用途与关键字段
    - 表结构从零设计，不做既有模型的照搬
    - 通过 psql 语法校验
  body: |
    数据模型从零设计。只参考玩法规则与数值区间，表结构、字段命名、索引策略全部自行定义。

    核心域：账号、世界、内政、军事、将、内容。
    每个域给出：表清单、ER 关系、索引策略、分服字段（server_id）。

- id: SPEC-002
  title: 通信协议定义（Protobuf + WebSocket）
  wave: 1
  domain: spec
  depends_on: [SPEC-001]
  size: L
  owner_dir: spec/proto
  scope: [spec/proto/**]
  out_of_scope: [internal/**]
  acceptance:
    - 请求/响应消息按域分包
    - 每个消息带注释说明字段含义
    - 生成代码可通过 protoc 校验
    - 覆盖 M1 所需接口：登录、拉取城池、建造、募兵
  body: |
    协议以 H5 客户端为消费者设计，不迁就旧 AMF 结构。
    统一响应包：code / msg / data，错误码按域分段。

- id: SPEC-003
  title: 核心规则文档（战斗与内政）
  wave: 1
  domain: spec
  depends_on: []
  size: M
  owner_dir: spec/rules
  scope: [spec/rules/**]
  out_of_scope: [spec/db/**, spec/proto/**]
  acceptance:
    - 战斗：兵种克制、伤害公式、回合流程、胜负判定
    - 内政：资源产出、建筑耗时与消耗、队列规则
    - 每条规则标注数值来源与调参入口
  body: |
    用文字 + 公式描述规则，产出是给实现 agent 看的规格，必须能直接照着写。
    数值先给一版可玩的初始值，后续按测试数据调优。

- id: SPEC-004
  title: 数值数据管线与 seed 生成
  wave: 1
  domain: spec
  depends_on: [SPEC-001]
  size: M
