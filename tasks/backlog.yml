    - 基础属性计算（等级、成长）有单测
    - 忠诚度字段可读写，含上下限
  body: |
    将领域骨架。读 spec/db 与 seed，不改 spec。先内存或 PG store 任选，需可测。

- id: CONTENT-001
  title: 道具与背包基础
  wave: 3
  domain: content
