- id: DOM-002
  title: 内政城池状态持久化（PostgreSQL）
  wave: 4
  domain: domestic
  depends_on: [DOM-001]
  size: L
  owner_dir: internal/domestic
  scope: [internal/domestic/**]
  out_of_scope: [internal/world/**, internal/api/**, internal/platform/**, spec/**, client/**]
  acceptance:
    - 按 spec/db/003_domestic.sql 实现 Store 接口：加载/保存 player_wallet（或城池级资源快照）、city_building、work_queue（建造队列）
    - Hub 在 RegisterCity / 升级完成 / 定时刷盘时写 PG；进程重启后能从库恢复城池资源、建筑等级与未完成队列
    - 资源增量结算逻辑不变（仍走内存 CityState，落库为快照 + 队列行，禁止每秒全量写库）
    - 单测或集成测覆盖：写入 → 新 Hub 实例加载 → 状态与重启前一致（含排队中的建造任务）
    - 不修改 spec/db DDL（缺字段先提 contract issue）
  body: |
    INTG-001 备注：当前 internal/api 在内存 map 持有 domestic.CityState，domestic.Hub 亦全内存。
    本卡只在 internal/domestic 增加 PG 持久化层，对外 Hub API 保持兼容；api 层后续卡负责在登录/建城时触发 Load。

    参照：internal/world/persist.go、internal/military/report/pg_store.go 的 pgx 用法；
    表结构以 spec/db/003_domestic.sql 为准。server_id 默认 dev 服 1。

