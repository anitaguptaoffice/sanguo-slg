  acceptance:
    - "`make build` 产出单二进制"
    - "`make test` 跑通"
    - "`make dev` 起本地全栈（app + postgres + redis）"
    - CI 跑 build + test + lint
  body: |
    Go 项目骨架：cmd/server、cmd/gm、internal/platform（配置、日志、DB、Redis）。
    目录预留各业务域，先放空包。

- id: PLAT-002
  title: 网关与连接管理
  wave: 1
  domain: platform
  depends_on: [PLAT-001, SPEC-002]
  size: L
  owner_dir: internal/platform/gateway
  scope: [internal/platform/gateway/**]
  out_of_scope: [internal/<业务域>/**]
  acceptance:
    - WebSocket 握手、鉴权、心跳、断线重连
    - 单机 3000 连接压测通过
    - 消息编解码走 proto 生成代码
    - 限流与黑白名单
  body: |
    网关无状态，只负责连接与路由，不承载业务逻辑。

- id: PLAT-003
  title: 可观测性接入
  wave: 1
  domain: platform
  depends_on: [PLAT-001]
  size: S
  owner_dir: internal/platform/obs
  scope: [internal/platform/obs/**, deploy/**]
  out_of_scope: [internal/<业务域>/**]
  acceptance:
    - 结构化日志（trace_id 贯穿）
    - Prometheus 指标：QPS、延迟、在线数、队列长度
    - 本地 Grafana 面板可看
  body: |
    从第一天就要有，否则线上问题只能靠猜。

- id: MIL-001
  title: 战斗引擎原型（纯函数）
  wave: 1
  domain: military
  depends_on: [SPEC-003]
  size: L
  owner_dir: internal/military/battle
  scope: [internal/military/battle/**]
  out_of_scope: [internal/military/march/**, spec/**]
  acceptance:
    - 输入双方部队 + 将领，输出战报（回合、伤害、损失）
    - 无 IO、无全局状态、可并发调用
    - 通过 100 组基准用例，结果稳定可复现
    - 单场 P99 < 50ms
  body: |
    这是全项目风险最高的一块，先做原型验证可行性。
    对拍方式：同一组输入跑固定基准用例集，比对最终兵力与胜负，结果入库作为回归基线。

