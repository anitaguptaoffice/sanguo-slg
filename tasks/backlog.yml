- id: MIL-001
  title: 战斗引擎原型（纯函数）
  wave: 1
  domain: military
  depends_on: [SPEC-003]
  size: L
  owner_dir: internal/military/battle
  scope: [internal/military/battle/**]
  out_of_scope: [internal/military/march/**, spec/**]
  acceptance:
    - 输入双方部队 + 将领，输出战报（回合、伤害、损失）
    - 无 IO、无全局状态、可并发调用
    - 通过 100 组基准用例，结果稳定可复现
    - 单场 P99 < 50ms
  body: |
    这是全项目风险最高的一块，先做原型验证可行性。
    对拍方式：同一组输入跑固定基准用例集，比对最终兵力与胜负，结果入库作为回归基线。

