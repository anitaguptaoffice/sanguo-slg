syntax = "proto3";

package sanguo.military.v1;

option go_package = "github.com/anitaguptaoffice/sanguo-slg/gen/go/sanguo/military/v1;militaryv1";

// 招贤馆基础计谋（R3-S4）。
// 1=千里奔袭 2=八门金锁 3=关门打狗 4=空城计
message CastTrickRequest {
  int32 server_id = 1;
  int64 city_id = 2;
  int32 trick_type = 3;
  int64 target_march_id = 4;
}
message CastTrickResponse {
  int64 cast_id = 1;
  bool success = 2;
  int32 roll = 3;
  int32 chance = 4;
  int64 new_deadline_ms = 5;
  int64 feint_until_ms = 6;
}
