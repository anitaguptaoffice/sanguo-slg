syntax = "proto3";

package sanguo.military.v1;

import "sanguo/common/v1/types.proto";

option go_package = "github.com/anitaguptaoffice/sanguo-slg/gen/go/sanguo/military/v1;militaryv1";

// route: military.v1.RecruitTroop
// 在指定城池募兵；完成后写入 city_troop（可经 work_queue 排队）。
message RecruitTroopRequest {
  // 募兵所在城池。
  int64 city_id = 1;
  // 兵种配置 ID。
  int32 unit_cfg_id = 2;
  // 招募数量（>0）。
  int32 count = 3;
}

message RecruitTroopResponse {
  // 该城该兵种最新数量（若未完成则可能为排队前快照 + 在途数量由实现定义）。
  sanguo.common.v1.CityTroopStack troop = 1;
  // 扣费后的资源钱包。
  sanguo.common.v1.ResourceWallet wallet = 2;
  // 若走队列：队列 ID；即时完成则为 0。
  int64 queue_id = 3;
  // 募兵完成时间（Unix 毫秒）；即时完成为 0。
  int64 finish_at_ms = 4;
}

// 行军状态机阶段（与 internal/military/march.MarchPhase 对齐）。
enum MarchPhase {
  MARCH_PHASE_UNSPECIFIED = 0;
  MARCH_PHASE_PENDING = 1;
  MARCH_PHASE_MARCHING = 2;
  MARCH_PHASE_ARRIVED = 3;
  MARCH_PHASE_RETURNING = 4;
  // 服务端已完成回城兵力结算；终态，仅保留历史，不是待发或通用结束态。
  MARCH_PHASE_RETURNED = 5;
}

// 行军单摘要，对应 march_order + field_army 对外视图。
message MarchSummary {
  // 行军订单 ID，对应 march_order.march_id。
  int64 march_id = 1;
  // 军团 ID，对应 field_army.army_id。
  int64 army_id = 2;
  // 出发城池（客户端展示用；表内可由 army 反查）。
  int64 origin_city_id = 3;
  int32 from_x = 4;
  int32 from_y = 5;
  int32 to_x = 6;
  int32 to_y = 7;
  // 行军目的：1=攻击 2=增援 3=采集（与 march_order.purpose 一致）。
  int32 purpose = 8;
  // 服务端权威阶段；不得用时间戳推断 RETURNED。详见 MARCH-RETURNED.md。
  MarchPhase phase = 9;
  // 出发与预计到达时间（Unix 毫秒）。
  int64 depart_at_ms = 10;
  int64 arrive_at_ms = 11;
  // 撤回行军中预计回到出发地时间；非 returning 为 0。
  int64 return_finish_at_ms = 12;
  // 当前军团编制。
  repeated sanguo.common.v1.CityTroopStack troops = 13;
}

// route: military.v1.StartMarch
// 从城池出兵向目标坐标行军；扣减城内兵力并创建行军单。
message StartMarchRequest {
  // 出兵城池 ID。
  int64 city_id = 1;
  int32 to_x = 2;
  int32 to_y = 3;
  // 行军目的，见 MarchSummary.purpose。
  int32 purpose = 4;
  // 本次带出的兵力（须为城内已有兵种）。
  repeated sanguo.common.v1.CityTroopStack troops = 5;
  // 带队将领实例 ID（须为玩家拥有且 status=空闲）。
  int64 hero_id = 6;
}

message StartMarchResponse {
  MarchSummary march = 1;
  // 扣兵后城内兵力快照（至少包含本次涉及的兵种）。
  repeated sanguo.common.v1.CityTroopStack city_troops = 2;
}

// route: military.v1.ListMarches
// 拉取当前玩家在会话服内的行军单（进行中与近期，含 RETURNED 历史）。
message ListMarchesRequest {
  // 可选：仅返回与该城池相关的行军。
  int64 city_id = 1;
  // 分页：默认 20，上限由服务端约束。
  int32 limit = 2;
  int32 offset = 3;
}

message ListMarchesResponse {
  repeated MarchSummary marches = 1;
  // 分页前匹配的行军记录总数（含近期历史），不是进行中数量。
  int32 total = 2;
}

// 战报列表项，对应 battle_report 表头字段。
message BattleReportSummary {
  int64 report_id = 1;
  int64 attacker_player_id = 2;
  // 守方为玩家时非 0；纯 NPC/城池守军可为 0。
  int64 defender_player_id = 3;
  // 守方为城池时非 0。
  int64 defender_city_id = 4;
  int32 location_x = 5;
  int32 location_y = 6;
  // 1=攻胜 2=守胜 3=平局（battle_report.outcome）。
  int32 outcome = 7;
  int64 created_at_ms = 8;
}

// 单场战斗明细，与 battle.BattleReport JSON 字段对齐（兵种键见 spec/rules/combat.md §1）。
message BattleReportDetail {
  // attacker_win / defender_win（与 battle.Result 一致；平局见 summary.outcome=3）。
  string result = 1;
  repeated BattleRound rounds = 2;
  map<string, int32> attacker_casualties = 3;
  map<string, int32> defender_casualties = 4;
  map<string, int32> final_attacker = 5;
  map<string, int32> final_defender = 6;
}

message BattleRound {
  int32 round = 1;
  map<string, int32> attacker_troops = 2;
  map<string, int32> defender_troops = 3;
  int32 attacker_to_def_hp = 4;
  int32 defender_to_att_hp = 5;
}

message BattleReportView {
  BattleReportSummary summary = 1;
  BattleReportDetail detail = 2;
}

// route: military.v1.GetBattleReport
// 按 ID 拉取单场战报（含回合明细）。
message GetBattleReportRequest {
  int64 report_id = 1;
}

message GetBattleReportResponse {
  BattleReportView report = 1;
}

// route: military.v1.ListBattleReports
// 拉取当前玩家可见战报（攻方或守方），按时间倒序分页。
message ListBattleReportsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListBattleReportsResponse {
  repeated BattleReportSummary reports = 1;
  int32 total = 2;
}
