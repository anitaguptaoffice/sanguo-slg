syntax = "proto3";

package sanguo.common.v1;

option go_package = "github.com/anitaguptaoffice/sanguo-slg/gen/go/sanguo/common/v1;commonv1";

// WebSocket 上行：单连接单帧单请求。
message ClientPacket {
  // 路由键，格式 `<domain>.v1.<Method>`，例如 `account.v1.Login`。
  string route = 1;
  // 与 route 匹配的请求消息（*Request）protobuf 序列化。
  bytes payload = 2;
  // 客户端生成的追踪 ID，服务端在 ServerPacket 中回显。
  string trace_id = 3;
  // 登录后携带：account_session.session_id（UUID 字符串）；Login 请求可留空。
  string session_id = 4;
  // 当前会话绑定的游戏服 ID；Login/EnterGameServer 成功后应与服务端会话一致，供网关校验。
  int32 server_id = 5;
}

// WebSocket 下行：统一响应包 code / msg / data。
message ServerPacket {
  // 业务状态码：0 成功；非 0 见 ErrorCode 及各域分段。
  int32 code = 1;
  // 面向玩家或调试的简短说明；成功时通常为空。
  string msg = 2;
  // 成功时为对应 *Response 的 protobuf 序列化；失败时通常为空。
  bytes data = 3;
  // 回显 ClientPacket.trace_id。
  string trace_id = 4;
}

// 错误码：按域分段，与 ServerPacket.code 数值一致（成功时 code=0，不填本枚举）。
enum ErrorCode {
  // 占位；成功响应不使用本枚举。
  ERROR_CODE_UNSPECIFIED = 0;

  // --- 公共 / 网关 10000–10999 ---
  // 请求体无法解析或 route 未知。
  COMMON_INVALID_PACKET = 10001;
  // 未登录或 session 无效/过期。
  COMMON_UNAUTHORIZED = 10002;
  // 服务端限流或维护。
  COMMON_UNAVAILABLE = 10003;
  // 未分类的内部错误。
  COMMON_INTERNAL = 10004;

  // --- 账号 20000–20999 ---
  // 登录名或密码错误。
  ACCOUNT_LOGIN_FAILED = 20001;
  // 账号被封禁。
  ACCOUNT_BANNED = 20002;
  // 目标服不存在或未开服。
  ACCOUNT_SERVER_NOT_FOUND = 20003;
  // 目标服不可进入（维护/停服等）。
  ACCOUNT_SERVER_UNAVAILABLE = 20004;
  // 该服尚无角色且当前不允许自动创角。
  ACCOUNT_NO_PLAYER = 20005;

  // --- 世界 30000–30999 ---
  // 城池不存在或不属于当前玩家。
  WORLD_CITY_NOT_FOUND = 30001;

  // --- 内政 40000–40999 ---
  // 资源不足。
  DOMESTIC_INSUFFICIENT_RESOURCE = 40001;
  // 建筑槽位或配置非法。
  DOMESTIC_INVALID_BUILDING = 40002;
  // 该槽位已在升级/建造队列中。
  DOMESTIC_BUILDING_BUSY = 40003;

  // --- 军事 50000–50999 ---
  // 兵种配置不存在。
  MILITARY_INVALID_UNIT = 50001;
  // 募兵数量非法（≤0 或超上限）。
  MILITARY_INVALID_TROOP_COUNT = 50002;
  // 兵营等级或前置条件不足。
  MILITARY_RECRUIT_NOT_ALLOWED = 50003;
  // 城内资源或人口不足无法募兵。
  MILITARY_INSUFFICIENT_RESOURCE = 50004;
  // 行军参数非法或状态不允许（如空兵力、坐标非法）。
  MILITARY_INVALID_MARCH = 50005;
  // 城内兵力不足无法出征。
  MILITARY_INSUFFICIENT_TROOPS = 50006;
  // 战报不存在或当前玩家无权查看。
  MILITARY_BATTLE_REPORT_NOT_FOUND = 50007;

  // --- 军团 60000–60999 ---
  // 军团不存在或不属于当前服。
  GUILD_NOT_FOUND = 60001;
  // 玩家已在其他军团（或重复加入）。
  GUILD_ALREADY_MEMBER = 60002;
  // 玩家不在目标军团。
  GUILD_NOT_MEMBER = 60003;
  // 军团名称非法（长度/敏感词等）。
  GUILD_NAME_INVALID = 60004;
  // 军团名称已被占用。
  GUILD_NAME_TAKEN = 60005;
  // 军团人数已满。
  GUILD_FULL = 60006;
  // 职务或权限不足。
  GUILD_PERMISSION_DENIED = 60007;
  // 团长须转让或解散后才能退出。
  GUILD_LEADER_CANNOT_LEAVE = 60008;

  // --- 聊天 61000–61999 ---
  // 频道不可用或玩家无权发言（如未加入军团）。
  CHAT_CHANNEL_FORBIDDEN = 61001;
  // 消息内容超长。
  CHAT_CONTENT_TOO_LONG = 61002;
  // 发送过于频繁（冷却或窗口配额）。
  CHAT_RATE_LIMITED = 61003;
  // 私聊目标玩家不存在或不在本服。
  CHAT_RECIPIENT_NOT_FOUND = 61004;
  // 军团频道缺少 guild_id 或玩家非成员。
  CHAT_GUILD_REQUIRED = 61005;

  // --- 排行 62000–62999 ---
  // 榜单类型未知或未开放。
  RANK_INVALID_TYPE = 62001;
  // 分页参数非法（page/page_size）。
  RANK_INVALID_PAGE = 62002;

  // --- 任务 63000–63999 ---
  // 任务配置不存在或未开放。
  QUEST_NOT_FOUND = 63001;
  // 前置任务或链未满足。
  QUEST_PREREQUISITE_NOT_MET = 63002;
  // 任务已接取或状态不允许重复接取。
  QUEST_ALREADY_ACCEPTED = 63003;
  // 任务未在进行中（无法上报进度）。
  QUEST_NOT_IN_PROGRESS = 63004;
  // 进度上报非法或超出目标。
  QUEST_PROGRESS_INVALID = 63005;
  // 任务不可领奖（未达成或已领）。
  QUEST_NOT_CLAIMABLE = 63006;
  // 任务已完成。
  QUEST_ALREADY_COMPLETED = 63007;
  // 任务链未解锁。
  QUEST_CHAIN_LOCKED = 63008;

  // --- 商城 64000–64999 ---
  // 货架不存在或未开放。
  SHOP_SHELF_NOT_FOUND = 64001;
  // 商品 offer 不存在或已下架。
  SHOP_OFFER_NOT_FOUND = 64002;
  // 货币或道具不足。
  SHOP_INSUFFICIENT_FUNDS = 64003;
  // 库存不足或已售罄。
  SHOP_SOLD_OUT = 64004;
  // 超过限购次数。
  SHOP_PURCHASE_LIMIT = 64005;
  // 购买数量非法。
  SHOP_INVALID_QUANTITY = 64006;

  // --- GM 65000–65999 ---
  // 运营鉴权失败或权限不足。
  GM_UNAUTHORIZED = 65001;
  // 目标玩家或账号不存在。
  GM_PLAYER_NOT_FOUND = 65002;
  // 审计字段缺失或非法。
  GM_INVALID_AUDIT = 65003;
  // 操作执行失败（内部错误或下游拒绝）。
  GM_OPERATION_FAILED = 65004;
}
