syntax = "proto3";

package sanguo.shop.v1;

import "sanguo/common/v1/types.proto";

option go_package = "github.com/anitaguptaoffice/sanguo-slg/gen/go/sanguo/shop/v1;shopv1";

// 限购周期类型。
enum PurchaseLimitType {
  PURCHASE_LIMIT_TYPE_UNSPECIFIED = 0;
  // 不限购。
  PURCHASE_LIMIT_TYPE_NONE = 1;
  // 自然日重置。
  PURCHASE_LIMIT_TYPE_DAILY = 2;
  // 自然周重置。
  PURCHASE_LIMIT_TYPE_WEEKLY = 3;
  // 永久限购。
  PURCHASE_LIMIT_TYPE_LIFETIME = 4;
}

// 货架上的可购商品（与商城配置表对外视图对齐）。
message ShopOffer {
  int32 offer_id = 1;
  // 货架 ID（如常规商城、活动页）。
  int32 shelf_id = 2;
  string shelf_name = 3;
  // 展示排序，越小越靠前。
  int32 sort_order = 4;
  // 售出道具 cfg_id。
  int32 item_cfg_id = 5;
  // 单次购买获得数量。
  int32 quantity_per_purchase = 6;
  // 售价（游戏内资源）；道具售价见 price_items。
  sanguo.common.v1.ResourceWallet price_resources = 7;
  // 道具货币售价（如消耗代币道具）。
  repeated sanguo.common.v1.RewardItem price_items = 8;
  // 全服或货架共享库存；不限库存为 -1。
  int32 stock_total = 9;
  int32 stock_remaining = 10;
  PurchaseLimitType limit_type = 11;
  // 周期内可购次数上限；不限购为 0。
  int32 purchase_limit = 12;
  // 当前玩家在本周期已购次数。
  int32 purchased_count = 13;
  // 限购周期重置时间（Unix 毫秒）；永久限购为 0。
  int64 limit_resets_at_ms = 14;
  // 上架开始/结束（Unix 毫秒）；0 表示无限制。
  int64 sale_start_at_ms = 15;
  int64 sale_end_at_ms = 16;
  bool sold_out = 17;
}

// route: shop.v1.ListShopShelf
// 拉取货架商品列表（含库存与玩家限购计数）。
message ListShopShelfRequest {
  int32 server_id = 1;
  // 指定货架；0 表示默认主货架或全部可见货架。
  int32 shelf_id = 2;
}

message ListShopShelfResponse {
  repeated ShopOffer offers = 1;
  // 服务端配置版本，便于客户端缓存失效。
  int64 catalog_version = 2;
}

// route: shop.v1.PurchaseShopOffer
// 购买商品：扣费后经发奖钩子发货（无真实支付渠道）。
message PurchaseShopOfferRequest {
  int32 server_id = 1;
  int32 offer_id = 2;
  // 购买份数（每份 quantity_per_purchase）；默认 1。
  int32 purchase_count = 3;
}

message PurchaseShopOfferResponse {
  ShopOffer offer = 1;
  sanguo.common.v1.RewardBundle granted_items = 2;
  // 扣费后钱包快照（若扣资源）。
  sanguo.common.v1.ResourceWallet wallet_after = 3;
}
