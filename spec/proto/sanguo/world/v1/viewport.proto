syntax = "proto3";

package sanguo.world.v1;

option go_package = "github.com/anitaguptaoffice/sanguo-slg/gen/go/sanguo/world/v1;worldv1";

// route: world.v1.GetWorldViewport
// 全屏大地图视口：按中心点与半径批量读取格点摘要与可见行军线段。
message GetWorldViewportRequest {
  int32 center_x = 1;
  int32 center_y = 2;
  int32 radius_x = 3;
  int32 radius_y = 4;
}

message WorldTileSummary {
  int32 x = 1;
  int32 y = 2;
  // 0=城池 1=平地 2=荒漠 3=森林 4=草原 5=山地 6=湖泊 7=沼泽
  int32 terrain = 3;
  int32 level = 4;
  int32 max_level = 5;
  int32 province_id = 6;
  string province_name = 7;
  int64 owner_player_id = 8;
  int64 owner_city_id = 9;
  string owner_name = 10;
  // 0=普通野地 1=黄巾营寨
  int32 npc_kind = 11;
  int32 npc_level = 12;
  bool in_battle = 13;
  // 城池官府等级（0=非城池或未知），供 R1-S6 城池外观分档。
  int32 city_level = 14;
}

message WorldMarchLine {
  int64 march_id = 1;
  int32 from_x = 2;
  int32 from_y = 3;
  int32 to_x = 4;
  int32 to_y = 5;
  int32 phase = 6;
  int64 arrive_at_ms = 7;
  int64 owner_player_id = 8;
}

// 州郡中心：供大地图"州郡跳转"使用。
message WorldProvinceCenter {
  int32 province_id = 1;
  string name = 2;
  int32 x = 3;
  int32 y = 4;
}

message GetWorldViewportResponse {
  repeated WorldTileSummary tiles = 1;
  repeated WorldMarchLine marches = 2;
  repeated WorldProvinceCenter provinces = 3;
}

// route: world.v1.GetWorldTileDetail
// 单个格点详情：地形加成、归属、公开守军规模档位与可执行动作。
message GetWorldTileDetailRequest {
  int32 x = 1;
  int32 y = 2;
}

message GetWorldTileDetailResponse {
  WorldTileSummary tile = 1;
  repeated string actions = 2;
  // 公开守军规模档位（不暴露逐兵种精确编制）。
  int32 garrison_tier = 3;
  int32 resource_bonus_percent = 4;
  int32 distance_from_capital = 5;
}

// 附属野地：本城已占领的野地列表。
message WorldOwnedField {
  int32 x = 1;
  int32 y = 2;
  int32 terrain = 3;
  int32 level = 4;
  string name = 5;
  int32 bonus_percent = 6;
}

// route: world.v1.ListOwnedFields
message ListOwnedFieldsRequest {
  int64 city_id = 1;
}

message ListOwnedFieldsResponse {
  repeated WorldOwnedField fields = 1;
}

// route: world.v1.AbandonField
message AbandonFieldRequest {
  int64 city_id = 1;
  int32 x = 2;
  int32 y = 3;
}

message AbandonFieldResponse {
  bool abandoned = 1;
}

// 采集奖励。
message FieldGatherReward {
  int64 food = 1;
  int64 wood = 2;
  int64 stone = 3;
  int64 iron = 4;
  int64 gold = 5;
  repeated FieldGatherItem items = 6;
}

message FieldGatherItem {
  int32 item_cfg_id = 1;
  int64 count = 2;
}

// 附属野地采集状态。
message FieldGatherView {
  int64 gather_id = 1;
  int32 x = 2;
  int32 y = 3;
  string name = 4;
  int64 finish_at_ms = 5;
  // 1=采集中，2=已领取。
  int32 status = 6;
  FieldGatherReward reward = 7;
}

// route: world.v1.StartFieldGather
message StartFieldGatherRequest {
  int64 city_id = 1;
  int32 x = 2;
  int32 y = 3;
  // 0 表示由服务端挑选一名空闲将领。
  int64 hero_id = 4;
}

message StartFieldGatherResponse {
  FieldGatherView gather = 1;
  int64 food_cost = 2;
}

// route: world.v1.ListFieldGathers
message ListFieldGathersRequest {
  int64 city_id = 1;
}

message ListFieldGathersResponse {
  repeated FieldGatherView gathers = 1;
}

// route: world.v1.ClaimFieldGather
message ClaimFieldGatherRequest {
  int64 gather_id = 1;
}

message ClaimFieldGatherResponse {
  FieldGatherReward reward = 1;
}
