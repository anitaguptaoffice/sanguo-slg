      warehouse:
        base_time_sec: 75
        base_cost: { food: 90, wood: 200, stone: 120, iron: 50 }
      diplomacy:
        base_time_sec: 130
        base_cost: { food: 160, wood: 150, stone: 120, iron: 60 }
      relay:
        base_time_sec: 100
        base_cost: { food: 120, wood: 140, stone: 90, iron: 40 }
      beacon:
        base_time_sec: 90
        base_cost: { food: 100, wood: 120, stone: 220, iron: 60 }
      house:
        base_time_sec: 40
        base_cost: { food: 60, wood: 80, stone: 40, iron: 0 }
  queue:
    slots_default: 1
    cancel_refund_ratio: 0.50
    tick_interval_sec: 1
