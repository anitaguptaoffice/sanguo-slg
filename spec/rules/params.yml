# SPEC-003 数值真源（初版可玩）。调参只改本文件，由 SPEC-004 导入游戏静态配置。
# 路径即文档中的「params.yml →」引用。

combat:
  max_rounds: 8
  round_damage_mult: 1.0
  damage_random_min: 0.95
  damage_random_max: 1.05
  min_troops_per_type: 1
  counter:
    advantage: 1.25
    disadvantage: 0.80
    neutral: 1.00
  troops:
    infantry:  { atk: 10, def: 15, hp: 100, speed: 50,  food_upkeep: 1 }
    cavalry:   { atk: 18, def: 8,  hp: 80,  speed: 100, food_upkeep: 2 }
    archer:    { atk: 14, def: 6,  hp: 70,  speed: 60,  food_upkeep: 1 }
    siege:     { atk: 25, def: 5,  hp: 50,  speed: 30,  food_upkeep: 3 }
  # 克制边：攻击方 → 防御方（见 combat.md 矩阵）
  counter_edges:
    - [cavalry, infantry]
    - [infantry, archer]
    - [archer, cavalry]
  hero:
    enabled: true
    atk_per_level: 0.02
    def_per_level: 0.02
    max_level_m1: 20

domestic:
  resources: [food, wood, stone, iron]
  warehouse_cap_base: 50000
  warehouse_cap_per_level: 25000
  main_hall:
    production_bonus_per_level: 0.05
  production:
    farm:   { base_per_hour: 120,  resource: food }
    lumber: { base_per_hour: 100,  resource: wood }
    quarry: { base_per_hour: 80,   resource: stone }
    iron:   { base_per_hour: 60,   resource: iron }
  build:
    cost_growth: 1.60
    time_growth: 1.50
    buildings:
      main_hall:
        base_time_sec: 60
        base_cost: { food: 200, wood: 200, stone: 100, iron: 50 }
      farm:
        base_time_sec: 45
        base_cost: { food: 50, wood: 150, stone: 30, iron: 0 }
      lumber:
        base_time_sec: 45
        base_cost: { food: 50, wood: 100, stone: 50, iron: 0 }
      quarry:
        base_time_sec: 50
        base_cost: { food: 80, wood: 80, stone: 100, iron: 0 }
      iron:
        base_time_sec: 55
        base_cost: { food: 100, wood: 80, stone: 80, iron: 50 }
      barracks:
        base_time_sec: 90
        base_cost: { food: 150, wood: 200, stone: 150, iron: 100 }
      wall:
        base_time_sec: 120
        base_cost: { food: 100, wood: 100, stone: 300, iron: 150 }
  queue:
    slots_default: 1
    cancel_refund_ratio: 0.50
    tick_interval_sec: 1
