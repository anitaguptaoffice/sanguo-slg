# R1-S1 世界野地与黄巾营寨守军配置。
#
# 地形编号与 map_cell.terrain 一致：0=城池 1=平地 2=荒漠 3=森林 4=草原 5=山地 6=湖泊 7=沼泽。
# total_by_level 给出 Lv1..Lv10 的守军总兵力，按 troop_mix 比例拆分为四个兵种；
# 拆分后每兵种至少 1 人，余数归入比例最高的兵种，保证生成结果确定。
version: 1

# 守将三维曲线：按野地等级 1..10 取 HeroForce / HeroIntel。
npc_hero_curve:
  force_by_level: [40, 48, 56, 66, 78, 92, 108, 126, 146, 168]
  intel_by_level: [30, 37, 45, 54, 64, 76, 89, 104, 120, 138]
  hero_exp_by_level: [20, 35, 55, 80, 110, 150, 200, 260, 330, 420]

item_drops:
  - {code: food_bundle_s, weight: 12}
  - {code: wood_bundle_s, weight: 10}
  - {code: iron_bundle_s, weight: 6}
  - {code: speedup_5m, weight: 5}
  - {code: hero_shard_common, weight: 4}

terrains:
  plain:
    terrain_id: 1
    name: 平地
    bonus_percent: {food: 5, wood: 5}
    troop_mix: {infantry: 70, archer: 20, cavalry: 10}
    total_by_level: [40, 80, 140, 220, 320, 450, 600, 780, 1000, 1250]
    loot_per_level: {food: 120, wood: 60, stone: 0, iron: 0, gold: 3}
  desert:
    terrain_id: 2
    name: 荒漠
    bonus_percent: {stone: 8}
    troop_mix: {infantry: 60, archer: 30, cavalry: 10}
    total_by_level: [35, 70, 120, 190, 280, 390, 520, 680, 870, 1080]
    loot_per_level: {food: 60, wood: 0, stone: 90, iron: 10, gold: 4}
  forest:
    terrain_id: 3
    name: 森林
    bonus_percent: {wood: 10}
    troop_mix: {infantry: 55, archer: 30, cavalry: 15}
    total_by_level: [45, 90, 150, 240, 350, 480, 640, 830, 1060, 1320]
    loot_per_level: {food: 80, wood: 140, stone: 0, iron: 0, gold: 3}
  grass:
    terrain_id: 4
    name: 草原
    bonus_percent: {food: 8}
    troop_mix: {infantry: 50, cavalry: 35, archer: 15}
    total_by_level: [42, 85, 145, 230, 330, 460, 610, 790, 1010, 1260]
    loot_per_level: {food: 150, wood: 40, stone: 0, iron: 0, gold: 2}
  mountain:
    terrain_id: 5
    name: 山地
    bonus_percent: {iron: 10}
    troop_mix: {infantry: 65, archer: 25, cavalry: 10}
    total_by_level: [50, 100, 170, 270, 390, 540, 720, 940, 1200, 1500]
    loot_per_level: {food: 60, wood: 30, stone: 50, iron: 120, gold: 4}
  lake:
    terrain_id: 6
    name: 湖泊
    bonus_percent: {food: 10}
    troop_mix: {infantry: 60, archer: 30, cavalry: 10}
    total_by_level: [38, 76, 130, 205, 300, 420, 560, 730, 930, 1160]
    loot_per_level: {food: 170, wood: 30, stone: 0, iron: 0, gold: 2}
  swamp:
    terrain_id: 7
    name: 沼泽
    bonus_percent: {wood: 6, iron: 4}
    troop_mix: {infantry: 60, archer: 30, cavalry: 10}
    total_by_level: [48, 95, 160, 255, 370, 510, 680, 880, 1120, 1400]
    loot_per_level: {food: 70, wood: 90, stone: 20, iron: 40, gold: 5}

npc_camps:
  yellow_turban:
    npc_kind: 1
    name: 黄巾营寨
    troop_mix: {infantry: 55, archer: 30, cavalry: 15}
    total_by_level: [60, 120, 200, 300, 420, 560, 720, 900, 1150, 1400]
    loot_per_level: {food: 160, wood: 120, stone: 60, iron: 40, gold: 12}
    item_drops:
      - {code: speedup_5m, weight: 10}
      - {code: recruit_scroll, weight: 4}
      - {code: hero_shard_common, weight: 8}
