syntax = "proto3";

package sanguo.account.v1;

option go_package = "github.com/anitaguptaoffice/sanguo-slg/internal/account/pb/sanguo/account/v1;accountv1";

// route: account.v1.Register
// 注册全局账号（与游戏服无关）。
message RegisterRequest {
  string login_name = 1;
  string password = 2;
}

message RegisterResponse {
  int64 account_id = 1;
}

// route: account.v1.RefreshSession
// 续期当前会话；ClientPacket.session_id 须为有效会话。
message RefreshSessionRequest {}

message RefreshSessionResponse {
  string session_id = 1;
  int64 session_expires_at_ms = 2;
}
