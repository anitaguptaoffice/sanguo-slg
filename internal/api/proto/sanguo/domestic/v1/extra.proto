syntax = "proto3";

package sanguo.domestic.v1;

import "sanguo/common/v1/types.proto";

option go_package = "github.com/anitaguptaoffice/sanguo-slg/internal/api/pb/sanguo/domestic/v1;domesticv1";

// route: domestic.v1.GetCityState
message GetCityStateRequest {
  int64 city_id = 1;
}

// Complete ready-troop row; deliberately excludes queued, marching and wounded.
message ReadyTroopCount {
  // Positive configured unit ID.
  int32 unit_cfg_id = 1;
  // Positive resident count available for military debit in the running Hub.
  int32 count = 2;
}

message CityGarrisonSnapshot {
  // Full set from ONE atomic Hub snapshot, unique IDs in ascending order.
  // Missing IDs mean zero only when this enclosing snapshot is present.
  repeated ReadyTroopCount troops = 1;
}

message GetCityStateResponse {
  sanguo.common.v1.ResourceWallet wallet = 1;
  repeated sanguo.common.v1.CityBuilding buildings = 2;
  // CLIENT-059 / INTG-017: per-hour production (food/wood/stone/iron); gateway extension field 3.
  sanguo.common.v1.ResourceWallet production_rates = 3;
  // Absent: unknown/unavailable. Present empty: authoritative zero ready troops.
  CityGarrisonSnapshot garrison = 4;
}
