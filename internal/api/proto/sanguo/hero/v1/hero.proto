syntax = "proto3";

package sanguo.hero.v1;

option go_package = "github.com/anitaguptaoffice/sanguo-slg/internal/api/pb/sanguo/hero/v1;herov1";

message PlayerHeroSummary {
  int64 hero_id = 1;
  int32 template_cfg_id = 2;
  int32 level = 3;
  int32 loyalty = 4;
}

message ListPlayerHeroesRequest {
  int32 server_id = 1;
  int32 page_size = 2;
  int32 page_offset = 3;
}

message ListPlayerHeroesResponse {
  repeated PlayerHeroSummary heroes = 1;
  int32 total_count = 2;
}

message GetHeroDetailRequest {
  int32 server_id = 1;
  int64 hero_id = 2;
}

message HeroAttributes {
  int32 force = 1;
  int32 intel = 2;
  int32 politics = 3;
  int32 command = 4;
}

message GetHeroDetailResponse {
  int64 hero_id = 1;
  int32 template_cfg_id = 2;
  string template_name = 3;
  string template_code = 4;
  int32 rarity = 5;
  int32 level = 6;
  int32 loyalty = 7;
  int32 loyalty_min = 8;
  int32 loyalty_max = 9;
  HeroAttributes attributes = 10;
}

message RecruitHeroRequest {
  int32 server_id = 1;
  int32 template_cfg_id = 2;
  int32 item_cfg_id = 3;
  string pool = 4;
}

message RecruitHeroResponse {
  int64 hero_id = 1;
  int32 template_cfg_id = 2;
  int32 level = 3;
  int32 loyalty = 4;
}
