syntax = "proto3";

package sanguo.world.v2;

option go_package = "github.com/anitaguptaoffice/sanguo-slg/internal/api/pb/sanguo/world/v1;worldv1";

// Registered SPEC-CITY-CREATION-WIRE-001; validity: FIRST-CITY-WIRE.md.
// API codec lives in worldv1 Go package (PG inventory); protobuf package remains sanguo.world.v2.
message FirstCityEmpty {}

message FirstCityScope {
  string realm_id = 1;
  int32 server_id = 2;
  int64 player_id = 3;
  int64 account_id = 4;
}

message FirstCityPredecessor {
  oneof value {
    FirstCityEmpty empty = 1;
    string rejected_command_id = 2;
  }
}

message FirstCityProposal {
  string command_id = 1;
  FirstCityPredecessor predecessor = 2;
  optional string name = 3;
  optional int32 x = 4;
  optional int32 y = 5;
}

message FirstCityCanonical {
  FirstCityScope scope = 1;
  string operation = 2;
  uint32 operation_version = 3;
  uint32 canonical_version = 4;
  FirstCityProposal proposal = 5;
}

message FirstCityTemplateRef {
  string template_version = 1;
  string rules_version = 2;
  string catalog_version = 3;
  uint32 content_encoding_version = 4;
  bytes content_sha256 = 5;
}

message FirstCitySuccess {
  int64 city_id = 1;
  int32 server_id = 2;
  int64 player_id = 3;
  optional bool is_capital = 4;
  optional int32 wall_level = 5;
  optional int32 morale = 6;
}

enum FirstCityRejectionReason {
  FIRST_CITY_REJECTION_REASON_UNSPECIFIED = 0;
  FIRST_CITY_REJECTION_TERRAIN = 1;
  FIRST_CITY_REJECTION_COORDINATE_OCCUPIED = 2;
}

message FirstCityRejection {
  FirstCityRejectionReason reason = 1;
}

message FirstCityRecord {
  FirstCityCanonical canonical = 1;
  FirstCityTemplateRef template = 2;
  oneof state {
    FirstCityEmpty pending = 3;
    FirstCitySuccess succeeded = 4;
    FirstCityRejection rejected_no_effect = 5;
  }
}

message FirstCityHead {
  oneof value {
    FirstCityEmpty empty = 1;
    FirstCityRecord command = 2;
  }
}

enum FirstCityOutcomeKind {
  FIRST_CITY_OUTCOME_UNSPECIFIED = 0;
  FIRST_CITY_OUTCOME_COMMAND = 1;
  FIRST_CITY_OUTCOME_ID_CONTENT_CONFLICT = 2;
  FIRST_CITY_OUTCOME_HEAD_CONFLICT = 3;
  FIRST_CITY_OUTCOME_NOT_OBSERVED = 4;
}

message FirstCityOutcome {
  FirstCityScope scope = 1;
  FirstCityOutcomeKind kind = 2;
  string requested_command_id = 3;
  FirstCityRecord command = 4;
  FirstCityHead head = 5;
}

message SubmitFirstCityRequest {
  FirstCityScope expected_scope = 1;
  FirstCityProposal proposal = 2;
}

message SubmitFirstCityResponse {
  FirstCityOutcome outcome = 1;
}

message ContinueFirstCityRequest {
  FirstCityScope expected_scope = 1;
  FirstCityProposal proposal = 2;
}

message ContinueFirstCityResponse {
  FirstCityOutcome outcome = 1;
}

message GetFirstCityResultRequest {
  FirstCityScope expected_scope = 1;
  string command_id = 2;
}

message GetFirstCityResultResponse {
  FirstCityOutcome outcome = 1;
}

message DiscoverFirstCityIntentRequest {}

message DiscoverFirstCityIntentResponse {
  FirstCityScope scope = 1;
  FirstCityHead head = 2;
}
